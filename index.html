<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Serie A">
<meta name="description" content="Modello statistico per la Serie A: forze delle squadre, probabilità di ogni partita, arbitri, e quanto il modello sbaglia davvero.">
<meta name="theme-color" content="#F5F7F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121714" media="(prefers-color-scheme: dark)">
<title>Modello Serie A</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2316211D'/%3E%3Ccircle cx='90' cy='90' r='46' fill='none' stroke='%23F5F7F5' stroke-width='9'/%3E%3Cpath d='M90 52l26 19-10 31H74l-10-31z' fill='%23F5F7F5'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2316211D'/%3E%3Ccircle cx='90' cy='90' r='46' fill='none' stroke='%23F5F7F5' stroke-width='9'/%3E%3Cpath d='M90 52l26 19-10 31H74l-10-31z' fill='%23F5F7F5'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light dark;
  --bg:#F5F7F5; --card:#FFFFFF; --card2:#FAFBFA; --ink:#16211D; --mute:#6B7A74;
  --line:#E1E7E2; --line2:#EEF2EE; --accent:#2D6A4F; --accent-soft:#E6F0EA;
  --ok:#2D7A4F; --ok-soft:#E6F2EA; --warn:#C4453A; --warn-soft:#FDF0EE;
  --amber:#A96F1F; --amber-soft:#FBF2E4;
  --hero-bg:#16211D; --hero-ink:#FFFFFF;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4;
  --c6:#008300; --c7:#4a3aa7; --c8:#e34948; --c9:#8A968F;
  --seq1:#cde2fb; --seq2:#9ec5f4; --seq3:#6da7ec; --seq4:#3987e5; --seq5:#256abf; --seq6:#184f95;
  --sys:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono','Menlo','Roboto Mono',monospace;
  --safeb:env(safe-area-inset-bottom,0px); --safet:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121714; --card:#1C221F; --card2:#232A26; --ink:#ECF1EE; --mute:#95A29B;
    --line:#2C3531; --line2:#242B27; --accent:#6BC49A; --accent-soft:#1B2C24;
    --ok:#5FBF88; --ok-soft:#172A20; --warn:#F08A80; --warn-soft:#2E1D1B;
    --amber:#E0A65A; --amber-soft:#2C2418;
    --hero-bg:#253029; --hero-ink:#ECF1EE;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181;
    --c6:#008300; --c7:#9085e9; --c8:#e66767; --c9:#8A968F;
    --seq1:#173049; --seq2:#1c4a7a; --seq3:#2166a8; --seq4:#3987e5; --seq5:#6da7ec; --seq6:#9ec5f4;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);}
body{font-family:var(--sys);color:var(--ink);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
button,input,select{font-family:inherit;font-size:16px;color:inherit;}
h1,h2,h3,h4{margin:0;}

#app{padding-bottom:calc(96px + var(--safeb));}
.top{position:sticky;top:0;z-index:20;background:var(--bg);
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);padding:calc(var(--safet) + 12px) 16px 11px;
  display:flex;align-items:flex-end;gap:10px;}
.top .ttl{flex:1;min-width:0;}
.top h1{font-size:24px;font-weight:700;letter-spacing:-.5px;}
.top .sub{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:.6px;
  margin-top:3px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.top .ico{flex:none;border:1px solid var(--line);background:var(--card);border-radius:10px;
  width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--mute);}
.top .ico svg{width:18px;height:18px;}
.top .ico.gira svg{animation:gira 1s linear infinite;}
@keyframes gira{to{transform:rotate(360deg)}}
.wrap{padding:16px 16px 26px;max-width:680px;margin:0 auto;}

.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:var(--card);
  background:color-mix(in srgb,var(--card) 94%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--line);padding-bottom:var(--safeb);}
.tab{flex:1;border:0;background:none;padding:9px 2px 8px;display:flex;flex-direction:column;
  align-items:center;gap:3px;cursor:pointer;color:var(--mute);}
.tab svg{width:21px;height:21px;}
.tab span{font-size:9px;font-weight:500;white-space:nowrap;}
.tab svg{width:20px;height:20px;}
.tab{padding:9px 0 8px;}
.tab.on{color:var(--accent);}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;}
.card.tap{cursor:pointer;}
.card.tap:active{opacity:.8;}
.h2{font-size:11.5px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--mute);
  margin:22px 0 9px;display:flex;align-items:baseline;gap:8px;}
.h2:first-child{margin-top:0;}
.h2 .r{margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.2px;text-transform:none;}
.lede{font-size:13px;line-height:1.55;color:var(--mute);margin:0 0 12px;}
.lede b{color:var(--ink);}

.kpi{display:flex;gap:9px;margin-bottom:12px;}
.kpi>div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 11px;min-width:0;}
.kpi .l{font-family:var(--mono);font-size:9px;letter-spacing:.7px;text-transform:uppercase;color:var(--mute);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kpi .v{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.6px;margin-top:4px;}
.kpi .s{font-size:10.5px;color:var(--mute);margin-top:2px;line-height:1.3;}
.kpi .v.pos{color:var(--ok);} .kpi .v.neg{color:var(--warn);}

.hero{background:var(--hero-bg);color:var(--hero-ink);border-radius:16px;padding:18px;margin-bottom:12px;}
.hero .l{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;opacity:.62;}
.hero .v{font-family:var(--mono);font-size:34px;font-weight:600;letter-spacing:-1.2px;margin:5px 0 6px;}
.hero .s{font-size:12.5px;line-height:1.5;opacity:.85;}

/* ── partita ── */
.match{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:10px;cursor:pointer;}
.match:active{opacity:.82;}
.match .quando{font-family:var(--mono);font-size:10px;letter-spacing:.7px;color:var(--mute);
  text-transform:uppercase;margin-bottom:7px;display:flex;gap:8px;}
.match .quando .gg{margin-left:auto;}
.match .sfida{display:flex;align-items:center;gap:9px;margin-bottom:11px;}
.match .sfida .sq{flex:1;min-width:0;font-size:15.5px;font-weight:600;letter-spacing:-.2px;}
.match .sfida .sq.v{text-align:right;}
.match .sfida .vs{font-family:var(--mono);font-size:11px;color:var(--mute);flex:none;}
.prob{display:flex;height:26px;gap:2px;margin-bottom:7px;}
.prob i{display:block;border-radius:5px;position:relative;min-width:3px;
  font-family:var(--mono);font-size:10.5px;font-weight:600;color:#fff;
  display:flex;align-items:center;justify-content:center;overflow:hidden;}
.prob i.c{background:var(--c1);} .prob i.p{background:var(--c9);} .prob i.v{background:var(--c2);}
.probl{display:flex;font-family:var(--mono);font-size:10px;color:var(--mute);}
.probl span{flex:1;} .probl span:nth-child(2){text-align:center;} .probl span:nth-child(3){text-align:right;}
.mini{display:flex;gap:7px;margin-top:10px;}
.mini>div{flex:1;background:var(--card2);border-radius:9px;padding:7px 8px;text-align:center;min-width:0;}
.mini .l{font-family:var(--mono);font-size:8.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--mute);}
.mini .v{font-family:var(--mono);font-size:13.5px;font-weight:600;margin-top:2px;}

.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);}
.row:last-child{border-bottom:0;}
.row.tap{cursor:pointer;}
.row .pos{font-family:var(--mono);font-size:11px;color:var(--mute);width:20px;flex:none;text-align:right;}
.row .n{flex:1;font-size:14.5px;font-weight:500;min-width:0;}
.row .n em{font-style:normal;display:block;font-size:11.5px;color:var(--mute);font-weight:400;margin-top:2px;}
.row .v{font-family:var(--mono);font-size:14px;font-weight:600;text-align:right;white-space:nowrap;}
.row .v span{display:block;font-size:10px;color:var(--mute);font-weight:400;}
.empty{text-align:center;padding:26px 14px;color:var(--mute);font-size:13px;line-height:1.55;}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:5px;}

.note{font-size:12px;line-height:1.6;color:var(--mute);background:var(--card2);
  border-left:3px solid var(--line);border-radius:0 8px 8px 0;padding:11px 13px;margin-top:12px;}
.note b{color:var(--ink);}
.note.warn{background:var(--warn-soft);border-left-color:var(--warn);}
.note.ok{background:var(--ok-soft);border-left-color:var(--ok);}
.note.amber{background:var(--amber-soft);border-left-color:var(--amber);}
.note p{margin:0 0 8px;} .note p:last-child{margin-bottom:0;}

.btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);
  font-size:15px;font-weight:600;cursor:pointer;}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink);}
.btn.acc{background:var(--accent);color:#fff;}
.btn.sm{padding:10px;font-size:13px;}
.btn:active{opacity:.75;} .btn[disabled]{opacity:.45;cursor:default;}
.btn2{display:flex;gap:8px;}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 4px;font-size:12.5px;
  font-weight:500;color:var(--mute);cursor:pointer;min-width:0;}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.07);}

.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;
  letter-spacing:.4px;padding:3px 7px;border-radius:6px;background:var(--line2);color:var(--mute);}
.tag.ok{background:var(--ok-soft);color:var(--ok);}
.tag.warn{background:var(--warn-soft);color:var(--warn);}
.tag.amber{background:var(--amber-soft);color:var(--amber);}

/* ── barre orizzontali ── */
.cbar{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);}
.cbar:last-child{border-bottom:0;}
.cbar .cl{flex:none;width:88px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cbar .ct{flex:1;height:9px;background:var(--line2);border-radius:5px;overflow:hidden;min-width:20px;}
.cbar .ct i{display:block;height:100%;border-radius:5px;background:var(--c1);}
.cbar .cv{flex:none;font-family:var(--mono);font-size:12px;font-weight:600;width:66px;text-align:right;}
.cbar .cv em{font-style:normal;display:block;font-size:9.5px;color:var(--mute);font-weight:400;}

.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 12px;
  font-size:12.5px;cursor:pointer;color:var(--mute);line-height:1.2;}
.chips button.on{border-color:var(--accent);color:var(--ink);font-weight:600;background:var(--accent-soft);}
.chips button:active{opacity:.7;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--mute);margin-bottom:6px;}
.qbox{margin-top:12px;padding:12px 13px;background:var(--card2);border-radius:11px;}
.qbox label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin-bottom:7px;}
.qbox input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);outline:none;font-family:var(--mono);font-size:16px;font-weight:600;}
.qbox input:focus{border-color:var(--accent);}
.qesito{font-size:12px;line-height:1.55;color:var(--mute);margin-top:9px;}
.qesito b{color:var(--ink);}
/* ── mercati ── */
.mkt{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);}
.mkt:last-child{border-bottom:0;}
.mkt .mn{flex:1;min-width:0;font-size:13.5px;font-weight:500;}
.mkt .mn em{font-style:normal;display:block;font-size:10.5px;color:var(--mute);font-weight:400;margin-top:2px;
  font-family:var(--mono);}
.mkt .mb{flex:none;width:84px;}
.mkt .mp{flex:none;width:56px;text-align:right;font-family:var(--mono);font-size:13.5px;font-weight:600;}
.mkt .mp span{display:block;font-size:9px;color:var(--mute);font-weight:400;}
.fascia{position:relative;height:10px;background:var(--line2);border-radius:5px;overflow:hidden;}
.fascia .banda{position:absolute;top:0;height:100%;background:var(--c1);opacity:.30;border-radius:5px;display:block;}
.fascia .punto{position:absolute;top:0;width:2.5px;height:100%;background:var(--c1);display:block;border-radius:2px;}
.cons{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:10px;padding:9px 11px;
  background:var(--accent-soft);border-radius:10px;}
.cons .ct{font-family:var(--mono);font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:var(--accent);}
.cons b{font-size:13.5px;font-weight:600;flex:1;min-width:0;}
.cons .cq{font-family:var(--mono);font-size:10.5px;color:var(--mute);}
svg.chart{display:block;width:100%;overflow:visible;}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--mute);}
.legend i{width:9px;height:9px;border-radius:3px;display:block;}

/* ── matrice risultati ── */
.matrice{overflow-x:auto;margin:0 -4px;}
.matrice table{border-collapse:separate;border-spacing:2px;font-family:var(--mono);font-size:10.5px;margin:0 auto;}
.matrice td,.matrice th{width:30px;height:26px;text-align:center;border-radius:5px;font-weight:500;}
.matrice th{color:var(--mute);font-weight:600;font-size:10px;}
.matrice td{color:var(--ink);}
.matrice td.z{color:var(--mute);opacity:.55;}
.matrice td.hi{outline:2px solid var(--ink);outline-offset:-2px;font-weight:700;}

.mtx{overflow-x:auto;margin:0 -4px;}
.mtx table{border-collapse:separate;border-spacing:2px;font-family:var(--mono);font-size:11px;
  margin:0 auto;width:100%;}
.mtx td,.mtx th{height:28px;text-align:center;border-radius:5px;font-weight:500;background:var(--card2);}
.mtx th{color:var(--mute);font-weight:600;font-size:10px;background:none;white-space:nowrap;}
.mtx td{color:var(--ink);}
.mtx td.hot{background:var(--accent-soft);color:var(--accent);font-weight:700;}

/* ── sheet ── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;
  justify-content:center;animation:fade .18s ease;}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes su{from{transform:translateY(18px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet{background:var(--bg);width:100%;max-width:680px;border-radius:18px 18px 0 0;
  padding:14px 16px calc(20px + var(--safeb));max-height:93vh;overflow-y:auto;animation:su .22s ease;}
.sheet .sh{display:flex;align-items:center;margin-bottom:14px;gap:10px;}
.sheet .sh h3{flex:1;font-size:17px;font-weight:700;letter-spacing:-.3px;}
.sheet .sh button{border:0;background:var(--line2);color:var(--mute);width:30px;height:30px;
  border-radius:50%;font-size:17px;line-height:1;cursor:pointer;flex:none;}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px;}

/* ── caricamento ── */
.load{padding:60px 24px;text-align:center;}
.load .pb{height:6px;background:var(--line2);border-radius:4px;overflow:hidden;margin:18px auto 12px;max-width:280px;}
.load .pb i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s;}
.load h3{font-size:17px;font-weight:600;margin-bottom:6px;}
.load p{font-size:13px;color:var(--mute);line-height:1.55;margin:0;}
.slider{width:100%;accent-color:var(--accent);margin:6px 0 2px;}
.sl{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--mute);}
.sl b{font-family:var(--mono);font-size:14px;color:var(--ink);}
select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card2);outline:none;}
.hidden{display:none !important;}
/* ── scarti dalla media della giornata ── */
.sc{font-family:var(--mono);font-size:10px;font-weight:700;margin-left:6px;padding:1px 5px;
  border-radius:5px;vertical-align:1px;}
.sc.su,.v span.su,.row .v span.su{color:var(--ok);background:var(--ok-soft);}
.sc.giu,.v span.giu,.row .v span.giu{color:var(--amber);background:var(--amber-soft);}
.row .v span.su,.row .v span.giu{display:inline-block;font-family:var(--mono);font-size:10px;
  padding:1px 5px;border-radius:5px;margin-top:3px;font-weight:600;}

.spec{margin-top:12px;padding-top:11px;border-top:1px solid var(--line2);}
.spect{font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;
  color:var(--mute);margin-bottom:7px;}
.specr{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px;}
.specr b{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.specr span{font-family:var(--mono);font-weight:700;font-size:13px;}
.specr i{font-style:normal;font-family:var(--mono);font-size:10px;font-weight:600;
  padding:1px 5px;border-radius:5px;min-width:44px;text-align:center;}
.specr i.su{color:var(--ok);background:var(--ok-soft);}
.specr i.giu{color:var(--amber);background:var(--amber-soft);}

/* ── ammoniti ── */
.amm{display:flex;align-items:center;gap:8px;padding:11px 10px;border-radius:10px;
  border-bottom:1px solid var(--line2);cursor:pointer;margin:0 -4px;}
.amm:last-child{border-bottom:0;}
.amm.caldo{background:var(--warn-soft);}
.amm.freddo{background:var(--ok-soft);}
.ammn{flex:1;min-width:0;}
.ammn b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ammn em{font-style:normal;display:block;font-size:11px;color:var(--mute);margin-top:2px;}
.ammv{flex:none;width:52px;text-align:right;font-family:var(--mono);font-size:14px;font-weight:700;}
.ammv span{display:block;font-size:8.5px;color:var(--mute);font-weight:400;font-family:var(--sys);
  letter-spacing:.2px;}

/* ── verdetto in cima a Precisione ── */
.verdetto{background:var(--hero-bg);color:var(--hero-ink);border-radius:16px;padding:20px 18px;
  margin-bottom:14px;}
.verdetto .vt{font-family:var(--mono);font-size:10px;letter-spacing:1.1px;text-transform:uppercase;
  opacity:.62;margin-bottom:8px;}
.verdetto .vv{font-size:25px;font-weight:700;line-height:1.15;letter-spacing:-.5px;margin-bottom:10px;}
.verdetto.buono .vv{color:#7FD8A6;}
.verdetto.medio .vv{color:#E8BE7A;}
.verdetto .vs{font-size:13px;line-height:1.6;opacity:.85;}
.verdetto .vs b{opacity:1;font-weight:700;}

<body>
<div id="app"><div class="load"><h3>Carico i dati…</h3></div></div>
<div id="modal"></div>
<script src="modello.js"></script>
<script>
"use strict";
var M = window.Modello;

/* ══════════════════════════════════════════════════════════════
   STATO
   ══════════════════════════════════════════════════════════════ */
var S = {
  tab: 'giornata', doc: null, meta: null, mod: null, back: null, arb: null,
  mercatiAttivi: null,
  stato: 'carico', errore: null, avanzamento: 0, fase: 'Carico i dati',
  aggiustamenti: {}, arbitroScelto: {}, aggiornando: false, tempoCalcolo: 0
};
var VERSIONE = '3.2';
/* Un consiglio su una scommessa che il tuo operatore non accetta è un consiglio
   inutile. Questo è l'insieme standard che si trova su Sporttip; il resto resta
   disponibile ma spento, e si accende dalla sezione Dati. */
/* Quello che si trova davvero su Sporttip, e nient'altro.

   Il criterio non è "quali mercati so calcolare": sono sessantacinque. È quali
   puoi effettivamente giocare. Un modello che ti consiglia "Gol nel primo
   tempo" come giocata più solida, quando sul tuo operatore quel mercato non
   esiste, non ti ha dato un consiglio: ti ha fatto perdere tempo e ti ha tolto
   di mezzo la giocata buona, che era seconda in classifica.

   Gli altri restano tutti accesi dalla sezione Dati, uno per uno. Se il tuo
   operatore ne ha di più, accendili: nessuno qui sa cosa offre il tuo. */
/* Quali mercati esistono davvero dove giochi tu.

   Questa lista l'ho sbagliata due volte tirando a indovinare: prima consigliava
   "Gol nel primo tempo", poi il Multigol, e nessuno dei due esiste su Sporttip.
   Un consiglio ingiocabile non è neutro — prende il posto della giocata buona,
   che finisce seconda in classifica e non la vedi.

   Quindi adesso i mercati stanno in tre scaffali dichiarati, e solo il primo
   parte acceso:

   · VISTI      me li ha confermati qualcuno guardando la schedina vera.
   · PROBABILI  mercati standard che quasi tutti gli operatori hanno. Li
                accendi in un tocco, ma non do per scontato che ci siano.
   · IL RESTO   il modello li sa calcolare, il tuo operatore quasi certamente
                no. Restano lì per chi gioca altrove.

   Se ne trovi uno nello scaffale sbagliato, spostalo: la lista è tua, non mia. */
var MERCATI_VISTI = [
  '1', 'X', '2',                                  // Risultato finale
  'O05', 'O15', 'U15', 'O25', 'U25', 'O35', 'U35', 'O45', 'U45',   // Over/Under
  'DISP', 'PARI'                                  // Numero di reti dispari/pari
];
var MERCATI_PROBABILI = [
  '1X', 'X2', '12',                               // doppia possibilità
  'GG', 'NG',                                     // entrambe segnano
  'SC', 'SV'                                      // una squadra segna
];
var MERCATI_PRESET = MERCATI_VISTI.slice();
var MERCATI_NON_VISTI = ['MG13', 'MG24', 'MG25', 'MG12', 'MG14', 'MG23', 'MG34', 'MG15',
                         'PTO05', 'PTO15', 'PT1', 'PTX', 'PT2', 'PT1X', 'PTX2', 'PTGG',
                         'STO05', 'STO15', 'GENT', 'PIU2T'];
var CHIAVE_MERCATI = 'seriea_mercati_v4';           // si vede nella sezione Dati: serve a sapere cosa si sta guardando
var CHIAVE_CACHE = 'seriea_modello_v3';

/* ══════════════════════════════════════════════════════════════
   UTILI
   ══════════════════════════════════════════════════════════════ */
function mercatiAttivi(){
  if(S.mercatiAttivi) return S.mercatiAttivi;
  try{
    var raw = localStorage.getItem(CHIAVE_MERCATI);
    S.mercatiAttivi = raw ? JSON.parse(raw) : MERCATI_PRESET.slice();
  }catch(e){ S.mercatiAttivi = MERCATI_PRESET.slice(); }
  if(!S.mercatiAttivi.length) S.mercatiAttivi = MERCATI_PRESET.slice();
  return S.mercatiAttivi;
}
function mercatoAttivo(id){ return mercatiAttivi().indexOf(id) >= 0; }
function commutaMercato(id){
  var a = mercatiAttivi().slice(), i = a.indexOf(id);
  if(i >= 0){ if(a.length <= 3) return; a.splice(i,1); } else a.push(id);
  S.mercatiAttivi = a;
  try{ localStorage.setItem(CHIAVE_MERCATI, JSON.stringify(a)); }catch(e){}
  render();
}
function ripristinaMercati(){
  S.mercatiAttivi = MERCATI_PRESET.slice();
  try{ localStorage.setItem(CHIAVE_MERCATI, JSON.stringify(S.mercatiAttivi)); }catch(e){}
  render();
}
function accendiProbabili(){
  var a = mercatiAttivi().slice();
  MERCATI_PROBABILI.forEach(function(id){ if(a.indexOf(id) < 0) a.push(id); });
  S.mercatiAttivi = a;
  try{ localStorage.setItem(CHIAVE_MERCATI, JSON.stringify(a)); }catch(e){}
  render();
}
function scaffale(id){
  if(MERCATI_VISTI.indexOf(id) >= 0) return 'visto';
  if(MERCATI_PROBABILI.indexOf(id) >= 0) return 'probabile';
  return 'raro';
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pc(x, dec){ return (x*100).toFixed(dec==null?0:dec)+'%'; }
function nu(x, dec){ return Number(x).toFixed(dec==null?2:dec); }
var MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
var GIORNI = ['dom','lun','mar','mer','gio','ven','sab'];
function oggiISO(){ var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dataBreve(s){
  var p = String(s||'').split('-'); if(p.length<3) return s||'';
  var d = new Date(Date.parse(s+'T12:00:00Z'));
  return GIORNI[d.getUTCDay()]+' '+parseInt(p[2],10)+' '+MESI[parseInt(p[1],10)-1];
}
function dataLunga(s){
  var p = String(s||'').split('-'); if(p.length<3) return s||'';
  return parseInt(p[2],10)+' '+MESI[parseInt(p[1],10)-1]+' '+p[0];
}
function daOra(iso){
  if(!iso) return '';
  var d = new Date(iso);
  if(isNaN(d)) return String(iso).slice(0,16).replace('T',' ');
  var m = Math.round((Date.now()-d.getTime())/60000);
  if(m < 2) return 'adesso';
  if(m < 60) return m+' minuti fa';
  if(m < 48*60) return Math.round(m/60)+' ore fa';
  return Math.round(m/1440)+' giorni fa';
}

/* ══════════════════════════════════════════════════════════════
   CARICAMENTO DATI
   ══════════════════════════════════════════════════════════════ */
function prendi(percorso, forza){
  var url = percorso + (forza ? ('?t=' + Date.now()) : '');
  return fetch(url, forza ? {cache:'no-store'} : {}).then(function(r){
    if(!r.ok) throw new Error(percorso + ' — HTTP ' + r.status);
    return r.json();
  });
}
function carica(forza){
  S.stato = 'carico'; S.fase = 'Scarico i dati'; S.avanzamento = 0.03; render();
  return prendi('data/serie-a.json', forza).then(function(doc){
    S.doc = doc;
    return prendi('data/meta.json', forza).catch(function(){ return null; });
  }).then(function(meta){
    S.meta = meta;
    var cache = leggiCache();
    if(cache && !forza){
      applicaRisultato(cache, true);
      return;
    }
    calcola();
  }).catch(function(e){
    S.stato = 'senzadati'; S.errore = e.message; render();
  });
}
function leggiCache(){
  try{
    var raw = localStorage.getItem(CHIAVE_CACHE);
    if(!raw) return null;
    var c = JSON.parse(raw);
    var firma = (S.meta && S.meta.aggiornato) || (S.doc && S.doc.aggiornato) || '';
    if(c.firma !== firma) return null;
    if(c.partite !== (S.doc.partite||[]).length) return null;
    /* una copia salvata da una versione precedente dell'app non ha tutto quello
       che serve adesso: meglio rifare i conti che mostrare mezza app */
    if(!c.risultato || !c.risultato.se || !c.risultato.repliche) return null;
    return c.risultato;
  }catch(e){ return null; }
}
function scriviCache(ris){
  try{
    localStorage.setItem(CHIAVE_CACHE, JSON.stringify({
      firma: (S.meta && S.meta.aggiornato) || (S.doc && S.doc.aggiornato) || '',
      partite: (S.doc.partite||[]).length, risultato: ris
    }));
  }catch(e){}
}

/* ══════════════════════════════════════════════════════════════
   CALCOLO (worker, con ripiego dentro la pagina)
   ══════════════════════════════════════════════════════════════ */
function opzioniCalcolo(){
  var stagioni = (S.doc.stagioni||[]).slice().sort();
  /* il backtest parte dalla terza stagione disponibile: le prime due servono
     come memoria, altrimenti si giudica il modello quando ancora non sa niente */
  var da = null;
  if(stagioni.length >= 3){
    var anno = parseInt(stagioni[Math.max(0, stagioni.length-3)].slice(0,4),10);
    da = anno + '-08-01';
  }
  return { daBacktest: da, refitOgniGiorni: 3 };
}
function calcola(){
  var t0 = Date.now();
  S.stato = 'calcolo'; S.avanzamento = 0.05; S.fase = 'Preparo'; render();
  var messaggio = { tipo:'avvia', partite: S.doc.partite, opzioni: opzioniCalcolo() };
  var fatto = function(ris){
    S.tempoCalcolo = Date.now()-t0;
    scriviCache(ris);
    applicaRisultato(ris);
  };
  var fallito = function(msg){
    S.stato = 'errore'; S.errore = msg; render();
  };
  var usaWorker = true;
  try { if(typeof Worker === 'undefined' || location.protocol === 'file:') usaWorker = false; }
  catch(e){ usaWorker = false; }

  if(usaWorker){
    var w;
    try { w = new Worker('worker.js'); }
    catch(e){ usaWorker = false; }
    if(w){
      w.onmessage = function(ev){
        var m = ev.data||{};
        if(m.tipo === 'stato'){ S.avanzamento = m.q; S.fase = m.testo || m.fase; render(); }
        else if(m.tipo === 'pronto'){ w.terminate(); fatto(m.risultato); }
        else if(m.tipo === 'errore'){ w.terminate(); fallito(m.messaggio); }
      };
      w.onerror = function(){ try{w.terminate();}catch(e){} calcolaQui(fatto, fallito); };
      w.postMessage(messaggio);
      return;
    }
  }
  setTimeout(function(){ calcolaQui(fatto, fallito); }, 50);
}
/* Se il worker non parte (aperto da file://, browser vecchio) si calcola qui:
   l'interfaccia si blocca per qualche secondo ma l'app funziona lo stesso. */
function calcolaQui(fatto, fallito){
  try{
    var opz = opzioniCalcolo();
    var dati = M.prepara(S.doc.partite);
    var res = M.campionaBacktest(dati, {da:opz.daBacktest, refitOgniGiorni:4, iterazioni:80});
    var back = res.campioni.length > 50 ? M.valutaBacktest(res) : null;
    var peso = back ? back.pesoMigliore : 0.6;
    var stiro = back && back.stiroMigliore != null ? back.stiroMigliore : 1;
    var ancora = back && back.ancoraMigliore != null ? back.ancoraMigliore : 0;
    var mod = M.costruisci(S.doc.partite, {dati:dati, iterazioni:400, pesoTiri:peso,
                                           stiro:stiro, ancoraggio:ancora});
    var repliche = M.bootstrap(dati, {iterazioni:120}, 24, mod.gol);
    var se = M.sintesiBootstrap(repliche, mod.squadre.length);
    fatto({
      squadre: mod.squadre,
      gol: semplificaPar(mod.gol), tiri: semplificaPar(mod.tiri),
      primoTempo: semplificaPar(mod.primoTempo),
      pesoTiri: peso, stiro: stiro, ancoraggio: ancora,
      calibrazioneTiri: mod.calibrazioneTiri,
      xgVeri: dati.xgVeri||0, xgDaTiri: dati.xgDaTiri||0, allineamentoXg: dati.allineamentoXg||null,
      arbitri: M.statisticheArbitri(S.doc.partite, {k:12}),
      corner: M.statisticheCorner(S.doc.partite, {k:10}),
      vantaggioCorner: M.vantaggioCornerCasa(S.doc.partite), backtest: back,
      repliche: repliche, se: se, effettoRosso: M.effettoRosso(S.doc.partite, mod),
      partiteUsate: dati.righe.length, ultimaData: dati.ultimaData
    });
  }catch(e){ fallito(e.message||String(e)); }
}
function semplificaPar(p){
  if(!p) return null;
  return {mu0:p.mu0, gamma:p.gamma, rho:p.rho, n:p.n,
          att:Array.prototype.slice.call(p.att), dif:Array.prototype.slice.call(p.dif),
          osservazioni:p.osservazioni||0};
}
function applicaRisultato(ris, daCache){
  S.risultato = ris;
  S.back = ris.backtest; S.arb = ris.arbitri; S.corner = ris.corner || null;
  var indice = {};
  ris.squadre.forEach(function(s,i){ indice[s] = i; });
  S.mod = { squadre: ris.squadre, indice: indice, gol: ris.gol, tiri: ris.tiri,
            primoTempo: ris.primoTempo || null,
            pesoTiri: ris.pesoTiri, stiro: ris.stiro == null ? 1 : ris.stiro,
            ancoraggio: ris.ancoraggio == null ? 0 : ris.ancoraggio,
            calibrazioneTiri: ris.calibrazioneTiri,
            repliche: ris.repliche || null, se: ris.se || null,
            effettoRosso: ris.effettoRosso || null };
  S.simCache = {};
  S.daCache = !!daCache;
  S.stato = 'pronto';
  chiudiPronostici();       /* i pronostici passati si chiudono da soli */
  render();
}

/* ══════════════════════════════════════════════════════════════
   SQUADRE ATTIVE E CALENDARIO
   ══════════════════════════════════════════════════════════════ */
function stagioneCorrente(){
  var st = (S.doc.stagioni||[]).slice().sort();
  return st.length ? st[st.length-1] : null;
}
function squadreAttive(){
  var sc = stagioneCorrente(), set = {}, i, p;
  for(i=0;i<S.doc.partite.length;i++){
    p = S.doc.partite[i];
    if(p.s === sc){ set[p.c]=1; set[p.v]=1; }
  }
  for(i=0;i<(S.doc.calendario||[]).length;i++){
    p = S.doc.calendario[i];
    set[p.c]=1; set[p.v]=1;
  }
  var out = Object.keys(set).filter(function(s){ return S.mod && S.mod.indice[s]!=null; });
  /* se la stagione è appena cominciata può mancare qualcuno: si completa con
     le squadre dell'ultima stagione conclusa */
  if(out.length < 18){
    var st = (S.doc.stagioni||[]).slice().sort();
    var prec = st[st.length-2];
    for(i=0;i<S.doc.partite.length;i++){
      p = S.doc.partite[i];
      if(p.s === prec){ if(set[p.c]==null) set[p.c]=1; if(set[p.v]==null) set[p.v]=1; }
    }
    out = Object.keys(set).filter(function(s){ return S.mod && S.mod.indice[s]!=null; });
  }
  return out.sort();
}
function prossimePartite(){
  var oggi = oggiISO();
  var cal = (S.doc.calendario||[]).filter(function(p){ return p.d >= oggi && p.c && p.v; });
  cal.sort(function(a,b){ return a.d < b.d ? -1 : (a.d > b.d ? 1 : 0); });
  return cal;
}
function raggruppaGiornate(lista){
  var gruppi = [], i;
  for(i=0;i<lista.length;i++){
    var p = lista[i];
    var g = gruppi[gruppi.length-1];
    if(!g || M.giorni(g.inizio, p.d) > 4 || g.partite.length >= 10){
      g = {inizio:p.d, fine:p.d, partite:[], giornata:p.giornata||null};
      gruppi.push(g);
    }
    g.partite.push(p); g.fine = p.d;
  }
  return gruppi;
}
function chiavePartita(p){ return p.d+'|'+p.c+'|'+p.v; }

/* ══════════════════════════════════════════════════════════════
   PREVISIONE CON AGGIUSTAMENTI
   ══════════════════════════════════════════════════════════════ */
function aggiustamentiDi(p){
  var a = S.aggiustamenti[chiavePartita(p)] || {};
  var agg = {};
  if(a.casa) agg.attC = Math.log(Math.max(0.4, 1 - a.casa/100));
  if(a.via)  agg.attV = Math.log(Math.max(0.4, 1 - a.via/100));
  return agg;
}
/* Le quote della partita, quando la fonte le ha portate: sono l'ingrediente che
   fa scattare l'ancoraggio al mercato. Senza, il modello resta da solo. */
function quoteDi(p){
  return {q: p.q || null, qou: p.qou || null};
}
function previsione(p){
  var qq = quoteDi(p);
  return M.prevedi(S.mod, p.c, p.v, {agg: aggiustamentiDi(p), q: qq.q, qou: qq.qou});
}
/* La simulazione costa: si tiene in memoria finché non cambia qualcosa. */
function simulazione(p, N, conCampioni){
  var a = S.aggiustamenti[chiavePartita(p)] || {};
  var k = chiavePartita(p) + '|' + (a.casa||0) + '|' + (a.via||0) + '|' + (N||1200) + (conCampioni?'|c':'');
  if(S.simCache[k]) return S.simCache[k];
  var pRosso = null;
  if(S.arb){
    var st = S.arb.indiceSquadre || {};
    pRosso = (S.mod.effettoRosso && S.mod.effettoRosso.prob) || 0.05;
  }
  var qq = quoteDi(p);
  var sim = M.simula(S.mod, p.c, p.v, {
    N: N || 1200, agg: aggiustamentiDi(p),
    q: qq.q, qou: qq.qou,
    pRossoCasa: pRosso, pRossoVia: pRosso,
    campioni: conCampioni ? 140 : 0
  });
  if(sim) S.simCache[k] = sim;
  return sim;
}
/* I mercati con la loro fascia, la quota equa e la correzione storica.

   Ogni voce dell'elenco dichiara da quale campo della simulazione viene e se va
   letta al contrario. Prima qui c'era una tabella di corrispondenze scritta a
   mano, e ogni mercato nuovo voleva una riga in più: il primo che ci si
   dimenticava restava senza fascia, in silenzio. Adesso l'aggancio è automatico
   e i mercati sono diventati sessanta senza che questa funzione cresca. */
function mercatiDi(p, N, conCampioni){
  var sim = simulazione(p, N, conCampioni);
  if(!sim) return null;
  var f = sim.fasce, k;
  var medie = {};
  for(k in f) medie[k] = f[k].p;
  var bins = S.back && S.back.modello ? S.back.modello.calibrazione : null;
  var voci = M.elencoMercati(medie, [p.c, p.v]).concat(M.elencoTempi(medie, [p.c, p.v]));
  voci.forEach(function(m){
    var b = f[m.campo];
    if(b){
      m.p05 = m.inverso ? 1 - b.p95 : b.p05;
      m.p95 = m.inverso ? 1 - b.p05 : b.p95;
      if(b.campioni){
        m.campioni = m.inverso
          ? b.campioni.map(function(x){ return 1 - x; })
          : b.campioni.slice();
      }
    }
    m.p05 = Math.max(0, Math.min(m.p, m.p05 == null ? m.p : m.p05));
    m.p95 = Math.min(1, Math.max(m.p, m.p95 == null ? m.p : m.p95));
    m.quota = m.p > 0.001 ? 1/m.p : null;
    m.quotaPrudente = m.p05 > 0.001 ? 1/m.p05 : null;
    m.pStorica = bins ? M.calibra(m.p, bins) : m.p;
  });
  return {voci: voci, sim: sim};
}

/* ══════════════════════════════════════════════════════════════
   COSA HA DI SPECIALE QUESTA PARTITA

   Per un po' l'app ha ordinato i mercati per probabilità e chiamato "più
   solida" il primo della lista. Sembra ragionevole e non lo è: il primo è
   sempre "Almeno un gol" al 93%, in tutte le partite di tutte le giornate.
   Quota 1.08. Non è un consiglio, è una constatazione — e occupava il posto
   della cosa interessante, che finiva terza e non si vedeva.

   Il numero che informa non è quanto una cosa è probabile: è di quanto QUESTA
   partita si discosta dalle altre. Se l'Under 2.5 vale il 66% quando nel resto
   della giornata vale il 52%, quello è un fatto su questa partita. Se l'Over
   1.5 vale il 74% come ovunque, non dice niente di nessuno.

   Quindi si calcola la media di ogni mercato sull'intera giornata e si mostra
   dove lo scarto è più grande. Il risultato è che le dieci partite smettono di
   somigliarsi tutte, che è poi quello che uno si aspetta guardandole.
   ══════════════════════════════════════════════════════════════ */

/* Mercati che dicono la stessa cosa in modi diversi. Chi sale fa scendere gli
   altri della sua famiglia, quindi mostrarne due è mostrarne uno. */
var FAMIGLIE = {
  casa:'esito', pari:'esito', via:'esito',
  c1x:'doppia', cx2:'doppia', c12:'doppia',
  o05:'gol', o15:'gol', o25:'gol', o35:'gol', o45:'gol', o55:'gol',
  gol:'segnano', segnaC:'segnaC', segnaV:'segnaV', cnp:'segnaV', vnp:'segnaC',
  retiDispari:'parita', retiPari:'parita',
  mg12:'multigol', mg13:'multigol', mg14:'multigol', mg15:'multigol',
  mg23:'multigol', mg24:'multigol', mg25:'multigol', mg34:'multigol', mg03:'multigol',
  tc05:'golCasa', tc15:'golCasa', tc25:'golCasa',
  tv05:'golVia', tv15:'golVia', tv25:'golVia',
  h1c:'handicap', h2c:'handicap', h1v:'handicap', h2v:'handicap',
  cSecca:'secca', vSecca:'secca', m1:'margine',
  g0:'esatti', g1:'esatti', g2:'esatti', g3:'esatti', g4p:'esatti',
  pt1:'pt', ptX:'pt', pt2:'pt', pt1x:'ptDoppia', ptx2:'ptDoppia',
  ptO05:'ptGol', ptO15:'ptGol', ptGG:'ptSegnano',
  stO05:'stGol', stO15:'stGol', golEntrambi:'tempi', piuSecondo:'tempi'
};
function famigliaMercato(campo){ return FAMIGLIE[campo] || campo; }

var _mediaGiornata = null, _chiaveMedia = null;

function mediaGiornata(partite){
  var chiave = partite.map(chiavePartita).join('|') + '#' + mercatiAttivi().join(',');
  if(_mediaGiornata && _chiaveMedia === chiave) return _mediaGiornata;
  var somma = {}, n = 0;
  partite.forEach(function(p){
    var mk = mercatiDi(p, 600);
    if(!mk) return;
    n++;
    mk.voci.forEach(function(m){ somma[m.id] = (somma[m.id] || 0) + m.p; });
  });
  var media = {};
  for(var k in somma) media[k] = somma[k] / Math.max(1, n);
  _mediaGiornata = media; _chiaveMedia = chiave;
  return media;
}

/* Le selezioni di UNA partita, in un posto solo.

   Prima questa decisione era presa in due punti diversi con due filtri diversi
   — la scheda della giornata e il costruttore di schedine — e infatti
   mostravano cose diverse sulla stessa partita. Adesso la funzione è una: se
   sbaglia, sbaglia dappertutto uguale, che è molto più facile da accorgersene. */
function sceltePartita(p, quante){
  var mk = mercatiDi(p, 1500, true);
  if(!mk) return null;
  var media = mediaGiornata((S._prossime || []).slice(0, 10));
  var voci = mk.voci.filter(function(m){
    if(!mercatoAttivo(m.id)) return false;
    /* Sotto il 12% è una lotteria, sopra l'88% è una constatazione: in mezzo
       c'è tutto quello su cui vale la pena ragionare. */
    return m.p >= 0.12 && m.p <= 0.88;
  });
  voci.forEach(function(m){
    m.media = media[m.id] == null ? m.p : media[m.id];
    m.scarto = m.p - m.media;
    /* Quanto è notevole: lo scarto dalla giornata, ma pesato per quanto la
       stima è solida — uno scarto grande dentro una fascia enorme è rumore. */
    m.notevole = Math.abs(m.scarto) * (0.5 + 0.5 * Math.min(1, m.p05 / Math.max(0.05, m.p)));
  });
  /* "Vince Como +29" e "Vince Genoa −28" sono la stessa frase detta due volte:
     in una partita a tre esiti, se uno sale gli altri scendono per forza. Lo
     stesso vale per Over e Under, che sono lo stesso campo letto al contrario.
     Quindi di ogni famiglia si tiene solo il rappresentante più notevole. */
  var perScarto = [], presa = {};
  voci.slice().sort(function(a, b){ return b.notevole - a.notevole; }).forEach(function(m){
    var fam = famigliaMercato(m.campo);
    if(presa[fam]) return;
    presa[fam] = 1;
    perScarto.push(m);
  });
  var perSolidita = voci.slice().sort(function(a, b){ return b.p05 - a.p05; });
  return {
    tutte: voci, sim: mk.sim,
    speciali: perScarto.slice(0, quante || 3),
    solide: perSolidita.slice(0, quante || 3),
    ancora: perSolidita[0] || null            /* la selezione da usare in schedina */
  };
}

/* ══════════════════════════════════════════════════════════════
   COME SE LA CAVA: i pronostici che l'app segna da sola

   Un registro da riempire a mano non lo riempie nessuno, e comunque
   registrerebbe le TUE scelte, non quelle del modello. Qui invece l'app segna
   il proprio pronostico su ogni partita della giornata — quello che avrebbe
   detto lei — e quando il risultato arriva nell'archivio lo chiude da sola.

   Nessun campo da compilare, e soprattutto nessuna scusa: il modello si trova
   giudicato sulle previsioni che ha davvero fatto, non su quelle che uno si
   ricorda di aver segnato quando andavano bene.
   ══════════════════════════════════════════════════════════════ */

var CHIAVE_PRONOSTICI = 'seriea_pronostici_v1';

function pronostici(){
  if(S.pronostici) return S.pronostici;
  try{ S.pronostici = JSON.parse(localStorage.getItem(CHIAVE_PRONOSTICI) || '[]'); }
  catch(e){ S.pronostici = []; }
  if(!Array.isArray(S.pronostici)) S.pronostici = [];
  return S.pronostici;
}
function salvaPronostici(){
  try{ localStorage.setItem(CHIAVE_PRONOSTICI, JSON.stringify(S.pronostici || [])); }catch(e){}
}

/* Segna il pronostico di oggi su ogni partita in arrivo, se non c'è già. */
function segnaPronostici(){
  var prossime = (S._prossime && S._prossime.length ? S._prossime : prossimePartite()).slice(0, 10);
  if(!prossime.length) return;
  var p = pronostici(), visti = {}, nuovo = false;
  p.forEach(function(g){ visti[g.d + '|' + g.c + '|' + g.v] = 1; });
  prossime.forEach(function(par){
    var k = chiavePartita(par);
    if(visti[k]) return;
    var sc = sceltePartita(par, 1);
    if(!sc || !sc.solide.length) return;
    var m = sc.solide[0];
    p.push({d: par.d, c: par.c, v: par.v, mercato: m.id, nome: m.nome,
            p: Math.round(m.p * 1000) / 1000, esito: null});
    nuovo = true;
  });
  /* non cresce all'infinito: due stagioni di pronostici bastano e avanzano */
  if(p.length > 900) p = p.slice(p.length - 900);
  S.pronostici = p;
  if(nuovo) salvaPronostici();
}

/* Chiude quelli la cui partita è entrata nell'archivio. */
function chiudiPronostici(){
  var p = pronostici(), ps = (S.doc && S.doc.partite) || [], cambiato = false;
  var indice = {};
  ps.forEach(function(x){ if(x.gc != null) indice[x.c + '|' + x.v] = x; });
  p.forEach(function(g){
    if(g.esito === true || g.esito === false) return;
    var par = indice[g.c + '|' + g.v];
    if(!par || Math.abs(M.giorni(par.d, g.d)) > 4) return;
    var e = M.haVinto(g.mercato, par.gc, par.gv, par.ptc, par.ptv);
    if(e === null) return;
    g.esito = e; g.risultato = par.gc + '-' + par.gv;
    cambiato = true;
  });
  if(cambiato) salvaPronostici();
  return cambiato;
}

function bilancioPronostici(){
  var chiusi = pronostici().filter(function(g){ return g.esito === true || g.esito === false; });
  if(!chiusi.length) return null;
  var presi = 0, promessi = 0, bins = [];
  for(var b = 0; b < 5; b++) bins.push({da: 0.5 + b*0.1, a: 0.6 + b*0.1, n: 0, presi: 0, p: 0});
  chiusi.forEach(function(g){
    if(g.esito) presi++;
    promessi += g.p;
    var i = Math.min(4, Math.max(0, Math.floor((g.p - 0.5) * 10)));
    bins[i].n++; bins[i].p += g.p;
    if(g.esito) bins[i].presi++;
  });
  return {
    n: chiusi.length, presi: presi, promessi: promessi,
    tasso: presi / chiusi.length, atteso: promessi / chiusi.length,
    bins: bins.filter(function(b){ return b.n >= 3; }),
    aperti: pronostici().length - chiusi.length,
    ultimi: chiusi.slice(-14).reverse()
  };
}

/* ══════════════════════════════════════════════════════════════
   GRAFICI
   ══════════════════════════════════════════════════════════════ */
var _sigle = null;
function sigla(nome){
  if(!_sigle){
    _sigle = {};
    var usate = {};
    (S.mod ? S.mod.squadre : []).slice().sort().forEach(function(n){
      var base = n.replace(/[^A-Za-zÀ-ÿ]/g,'').toUpperCase();
      var s = base.slice(0,3), k = 3;
      while(usate[s] && k < base.length){ s = base.slice(0,k) + base.charAt(k); k++; s = s.slice(0,4); }
      if(usate[s]) s = base.slice(0,2) + String(Object.keys(usate).length%10);
      usate[s] = 1; _sigle[n] = s;
    });
  }
  return _sigle[nome] || String(nome||'').slice(0,3).toUpperCase();
}
function coloreSeq(q){
  var scala = ['var(--seq1)','var(--seq2)','var(--seq3)','var(--seq4)','var(--seq5)','var(--seq6)'];
  return scala[Math.max(0, Math.min(5, Math.floor(q*6)))];
}

/* Attacco contro difesa: in alto a destra le squadre forti davanti e dietro. */
function scatterForze(lista){
  if(lista.length < 3) return '';
  var W=340, H=270, L=30, R=12, T=14, B=30;
  var xs = lista.map(function(f){ return f.attacco; }), ys = lista.map(function(f){ return f.difesa; });
  var minX = Math.min.apply(null,xs), maxX = Math.max.apply(null,xs);
  var minY = Math.min.apply(null,ys), maxY = Math.max.apply(null,ys);
  var padX = (maxX-minX)*0.14 + 0.02, padY = (maxY-minY)*0.14 + 0.02;
  minX-=padX; maxX+=padX; minY-=padY; maxY+=padY;
  var px = function(v){ return L + (v-minX)/(maxX-minX) * (W-L-R); };
  var py = function(v){ return H-B - (v-minY)/(maxY-minY) * (H-T-B); };
  var g = '';
  var zx = px(0), zy = py(0);
  g += '<line x1="'+zx.toFixed(1)+'" y1="'+T+'" x2="'+zx.toFixed(1)+'" y2="'+(H-B)+'" stroke="var(--line)" stroke-width="1"/>';
  g += '<line x1="'+L+'" y1="'+zy.toFixed(1)+'" x2="'+(W-R)+'" y2="'+zy.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>';
  g += '<text x="'+(W-R)+'" y="'+(H-B+13)+'" text-anchor="end" font-size="8.5" fill="var(--mute)" font-family="var(--mono)">attacco →</text>';
  g += '<text x="'+L+'" y="'+(H-B+13)+'" font-size="8.5" fill="var(--mute)" font-family="var(--mono)">← attacco</text>';
  g += '<text x="'+(L-6)+'" y="'+(T+4)+'" text-anchor="end" font-size="8.5" fill="var(--mute)" font-family="var(--mono)">difesa</text>';
  g += '<text x="'+(L-6)+'" y="'+(H-B)+'" text-anchor="end" font-size="8.5" fill="var(--mute)" font-family="var(--mono)">↓</text>';
  /* Prima tutti i pallini, poi tutte le etichette: altrimenti un pallino
     disegnato dopo copre l'etichetta di chi è venuto prima. Ogni etichetta si
     mette dove trova posto, evitando sia le altre etichette sia i pallini. */
  var presi = [];
  lista.forEach(function(f){
    var x = px(f.attacco), y = py(f.difesa);
    presi.push({x:x-5, y:y-5, w:10, h:10});
    g += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="4" fill="var(--c1)" stroke="var(--card)" stroke-width="2">'+
      '<title>'+esc(f.squadra)+' — attacco '+nu(f.attacco,2)+', difesa '+nu(f.difesa,2)+'</title></circle>';
  });
  function libero(bx, by, bw, bh){
    if(bx < 2 || bx + bw > W - 2 || by < 4 || by + bh > H - B + 2) return false;
    for(var q=0;q<presi.length;q++){
      var r = presi[q];
      if(!(bx + bw < r.x || bx > r.x + r.w || by + bh < r.y || by > r.y + r.h)) return false;
    }
    return true;
  }
  var etichette = '';
  lista.forEach(function(f){
    var x = px(f.attacco), y = py(f.difesa);
    var testo = sigla(f.squadra);
    var bw = testo.length * 4.9 + 2, bh = 8.5;
    var tentativi = [[x+6, y-4], [x-6-bw, y-4], [x-bw/2, y-13], [x-bw/2, y+6],
                     [x+6, y-13], [x+6, y+5], [x-6-bw, y-13], [x-6-bw, y+5],
                     [x-bw/2, y-21], [x-bw/2, y+14]];
    var messo = null;
    for(var q=0;q<tentativi.length && !messo;q++){
      if(libero(tentativi[q][0], tentativi[q][1], bw, bh)) messo = tentativi[q];
    }
    if(!messo) return;                      // meglio nessuna etichetta che una illeggibile
    presi.push({x:messo[0], y:messo[1], w:bw, h:bh});
    etichette += '<text x="'+messo[0].toFixed(1)+'" y="'+(messo[1]+7).toFixed(1)+
      '" font-size="7.5" font-family="var(--mono)" fill="var(--ink)">'+esc(testo)+'</text>';
  });
  g += etichette;
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Forza d\'attacco e di difesa di ogni squadra">'+g+'</svg>';
}

/* Quanto le probabilità dette corrispondono a quello che è successo davvero. */
function curvaCalibrazione(bins){
  var punti = bins.filter(function(b){ return b.n >= 25; });
  if(punti.length < 3) return '';
  var W=340,H=238,L=32,R=16,T=16,B=34;
  var px = function(v){ return L + v*(W-L-R); };
  var py = function(v){ return H-B - v*(H-T-B); };
  var g = '';
  [0,0.25,0.5,0.75,1].forEach(function(v){
    g += '<line x1="'+L+'" y1="'+py(v).toFixed(1)+'" x2="'+(W-R)+'" y2="'+py(v).toFixed(1)+'" stroke="var(--line2)" stroke-width="1"/>';
    g += '<text x="'+(L-5)+'" y="'+(py(v)+3).toFixed(1)+'" text-anchor="end" font-size="8" fill="var(--mute)" font-family="var(--mono)">'+(v*100).toFixed(0)+'</text>';
    g += '<text x="'+px(v).toFixed(1)+'" y="'+(H-B+13)+'" text-anchor="middle" font-size="8" fill="var(--mute)" font-family="var(--mono)">'+(v*100).toFixed(0)+'</text>';
  });
  g += '<line x1="'+px(0)+'" y1="'+py(0)+'" x2="'+px(1)+'" y2="'+py(1)+'" stroke="var(--mute)" stroke-width="1" stroke-dasharray="0" opacity=".45"/>';
  var d = '';
  punti.forEach(function(b,i){
    d += (i?'L':'M') + px(b.previsto).toFixed(1) + ' ' + py(b.osservato).toFixed(1) + ' ';
  });
  g += '<path d="'+d+'" fill="none" stroke="var(--c1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
  punti.forEach(function(b){
    var r = Math.max(3.5, Math.min(8, Math.sqrt(b.n)/3.4));
    g += '<circle cx="'+px(b.previsto).toFixed(1)+'" cy="'+py(b.osservato).toFixed(1)+'" r="'+r.toFixed(1)+
      '" fill="var(--c1)" stroke="var(--card)" stroke-width="2"><title>previsto '+pc(b.previsto,1)+
      ', successo '+pc(b.osservato,1)+' su '+b.n+' casi</title></circle>';
  });
  g += '<text x="'+((L+W-R)/2).toFixed(1)+'" y="'+(H-B+26)+'" text-anchor="middle" font-size="8.5" fill="var(--mute)" font-family="var(--mono)">probabilità detta dal modello (%)</text>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Curva di calibrazione">'+g+'</svg>'+
    '<div class="legend"><span>La linea grigia è la perfezione: se il modello dice 30% e succede 30 volte su 100, i punti ci stanno sopra.</span></div>';
}

function matriceHTML(m, gc, gv){
  var n = 6, i, j, max = 0;
  for(i=0;i<n;i++) for(j=0;j<n;j++) max = Math.max(max, m[i][j]);
  var h = '<div class="matrice"><table><tr><th></th>';
  for(j=0;j<n;j++) h += '<th>'+j+'</th>';
  h += '</tr>';
  for(i=0;i<n;i++){
    h += '<tr><th>'+i+'</th>';
    for(j=0;j<n;j++){
      var q = m[i][j]/max;
      var piu = (m[i][j] >= max-1e-12);
      h += '<td class="'+(m[i][j]<0.012?'z':'')+(piu?' hi':'')+'" style="background:'+
        (m[i][j]<0.012?'var(--card2)':coloreSeq(q))+';color:'+(q>0.62?'#fff':'var(--ink)')+
        '" title="'+i+'-'+j+': '+pc(m[i][j],1)+'">'+(m[i][j]*100).toFixed(m[i][j]>=0.095?0:1)+'</td>';
    }
    h += '</tr>';
  }
  return h + '</table></div>';
}

function rigaMercato(m){

function barraProb(pr){
  var v = [pr.casa, pr.pari, pr.via], cl = ['c','p','v'];
  return '<div class="prob">'+v.map(function(x,i){
    return '<i class="'+cl[i]+'" style="flex:'+Math.max(0.06,x).toFixed(4)+'">'+(x>=0.14?pc(x):'')+'</i>';
  }).join('')+'</div><div class="probl"><span>1 '+pc(v[0])+'</span><span>X '+pc(v[1])+
    '</span><span>2 '+pc(v[2])+'</span></div>';
}
function scartoTesto(pr, mercato){
  var mie = [pr.casa, pr.pari, pr.via], nomi = ['la vittoria in casa','il pareggio','la vittoria fuori'];
  var iMax = 0, dMax = 0;
  for(var i=0;i<3;i++){ var d = mie[i]-mercato[i]; if(Math.abs(d) > Math.abs(dMax)){ dMax = d; iMax = i; } }
  if(Math.abs(dMax) < 0.03) return 'Il modello, da solo, la vedrebbe praticamente uguale.';
  return 'Il modello da solo darebbe ' + (dMax>0?'più':'meno') + ' peso a ' + nomi[iMax] +
    ' (' + (dMax>0?'+':'−') + pc(Math.abs(dMax)) + ').';
}

/* Cartellini attesi, in breve, per la scheda della giornata. */
function cartelliniDi(p){
  if(!S.arb) return null;
  var scelto = S.arbitroScelto[chiavePartita(p)] || null;
  return M.cartelliniAttesi(S.arb, scelto, p.c, p.v);
}

     riga in meno che una riga che non dice niente */
  var speciali = sc ? sc.speciali.filter(function(m){ return Math.abs(m.scarto) >= 0.05; }).slice(0, 2) : [];

    barraProb(pr)+
    '<div class="mini">'+
      '<div><div class="l">Gol attesi</div><div class="v">'+nu(pr.golCasa,1)+'–'+nu(pr.golVia,1)+'</div></div>'+
      '<div><div class="l">Over 2.5</div><div class="v">'+pc(pr.over25)+'</div></div>'+
      '<div><div class="l">Gol/Gol</div><div class="v">'+pc(pr.gol)+'</div></div>'+
      '<div><div class="l">Ammoniti</div><div class="v">'+(car?nu(car.gialliTotali,1):'—')+'</div></div>'+
    '</div>'+
    (speciali.length
      ? '<div class="spec"><div class="spect">Cosa ha di diverso</div>'+
        speciali.map(function(m){
          return '<div class="specr"><b>'+esc(m.nome)+'</b>'+
            '<span>'+pc(m.p)+'</span>'+
            '<i class="'+(m.scarto>0?'su':'giu')+'">'+(m.scarto>0?'+':'−')+
            nu(Math.abs(m.scarto)*100,0)+' pt</i></div>';
        }).join('')+'</div>'
      : '<div class="spec"><div class="spect">Cosa ha di diverso</div>'+
        '<div class="specr" style="color:var(--mute);font-size:12.5px">'+
        'Niente di particolare: somiglia alle altre partite della giornata.</div></div>')+
    (mercato ? '<div class="note" style="margin-top:10px">Il mercato dice '+pc(mercato[0])+' · '+
      pc(mercato[1])+' · '+pc(mercato[2])+'. '+scartoTesto(pr.puro||pr, mercato)+'</div>' : '')+

/* ══════════════════════════════════════════════════════════════
   VISTA: AMMONITI

   L'archivio ha l'arbitro di 1140 partite, quanti falli fischia ciascuno e
   quanto se le vanno a cercare le venti squadre. Da quei tre numeri escono i
   cartellini attesi, e sono l'unica cosa in tutta l'app che non dipende da chi
   segna: dipende da chi fischia.

   Il modello è volutamente semplice: quanto è severo l'arbitro, per quanto sono
   fallose le due squadre, sulla media della lega. Le medie di un arbitro con
   nove gare non valgono quanto quelle di uno con novanta, quindi vengono tirate
   verso la media generale in proporzione a quanto poco ha arbitrato.
   ══════════════════════════════════════════════════════════════ */
function tabAmmoniti(){
  if(!S.arb || !S.arb.arbitri.length){
    return '<div class="card"><div class="empty"><b>Non ho ancora dati sugli arbitri</b>'+
      'Servono per questa sezione. Arrivano da API-Football con la chiave gratuita: '+
      'guarda lo stato in <b>Dati</b>.</div></div>';
  }
  var prossime = prossimePartite();
  if(!prossime.length) return '<div class="card"><div class="empty"><b>Nessuna partita in calendario</b>'+
    'I cartellini attesi si calcolano sulle partite in arrivo.</div></div>';
  S._prossime = prossime;
  var g = raggruppaGiornate(prossime)[0];
  var a = S.arb;

  var h = '<div class="h2">Ammoniti attesi</div>';
  h += '<p class="lede">Quanto è severo l\'arbitro × quanto se le vanno a cercare le due squadre, '+
    'sulla media della lega di <b>'+nu(a.mediaGialli,2)+' gialli a partita</b>. '+
    'Le designazioni escono due o tre giorni prima: finché non si sanno, qui c\'è la media.</p>';

  var righe = g.partite.map(function(p){
    var car = M.cartelliniAttesi(a, S.arbitroScelto[chiavePartita(p)] || null, p.c, p.v);
    return {p: p, car: car};
  }).sort(function(x, y){ return y.car.gialliTotali - x.car.gialliTotali; });

  h += '<div class="card">' + righe.map(function(r, i){
    var c = r.car;
    var caldo = c.gialliTotali > a.mediaGialli * 1.12;
    var freddo = c.gialliTotali < a.mediaGialli * 0.88;
    return '<div class="amm'+(caldo?' caldo':(freddo?' freddo':''))+'" onclick="apriPartita('+
      prossime.indexOf(r.p)+')">'+
      '<div class="ammn"><b>'+esc(r.p.c)+' – '+esc(r.p.v)+'</b>'+
      '<em>'+esc(dataBreve(r.p.d))+(r.p.o?' · '+esc(r.p.o):'')+
      (c.noto ? ' · '+esc(c.arbitro) : ' · arbitro non designato')+'</em></div>'+
      '<div class="ammv">'+nu(c.gialliTotali,1)+'<span>gialli</span></div>'+
      '<div class="ammv">'+pc(c.oltre35)+'<span>oltre 3.5</span></div>'+
      '<div class="ammv">'+pc(c.oltre45)+'<span>oltre 4.5</span></div>'+
    '</div>';
  }).join('') + '</div>';

  h += '<div class="note">Verde: partita più tranquilla della media. Rosso: più nervosa. '+
    'Tocca una riga per aprire la partita e scegliere l\'arbitro designato, se lo sai — '+
    'i numeri cambiano parecchio.</div>';

  h += '<div class="h2">Chi fischia più stretto<span class="r">'+
    a.arbitri.filter(function(x){ return x.n>=8; }).length+'</span></div><div class="card">'+
    barreOriz(a.arbitri.filter(function(x){ return x.n>=8; }).slice(0,12).map(function(x){
      return {l: x.nome, v: x.gialliCorretti, testo: nu(x.gialliCorretti,2)+' ('+x.n+')',
              colore: x.gialliCorretti > a.mediaGialli ? 'var(--warn)' : 'var(--c1)'};
    }))+
    '<div class="note">Gialli a partita, già corretti per quante gare ha diretto: le medie di chi '+
    'ne ha arbitrate poche vengono tirate verso la media della lega, altrimenti in cima ci finisce '+
    'sempre qualcuno con tre partite e una espulsione.</div></div>';

  h += '<div class="h2">Chi se le va a cercare</div><div class="card">'+
    barreOriz(a.squadre.filter(function(x){ return squadreAttive().indexOf(x.squadra)>=0; })
      .slice(0,10).map(function(x){
        return {l: x.squadra, v: x.gialliPartita, testo: nu(x.gialliPartita,2),
                colore: x.propensione > 1.05 ? 'var(--warn)' : 'var(--c1)'};
      }))+
    '<div class="note">Gialli presi a partita. Chi commette più falli ne prende di più, ma non in '+
    'proporzione: conta anche dove li commette e come protesta.</div></div>';
  return h;
}

/* ══════════════════════════════════════════════════════════════
   VISTA: SCHEDINE

   Le selezioni sono le stesse della Giornata, prese dalla stessa funzione.
   Prima ce n'erano due, con due filtri diversi, e mostravano cose diverse
   sulla stessa partita: era la cosa più fastidiosa dell'app, e giustamente.
   ══════════════════════════════════════════════════════════════ */
var PROFILI = [
  {id:'sicura', nome:'Prudente', min:1.6, max:2.4,
   testo:'Poche selezioni, tutte solide. Quota bassa perché la probabilità è alta: è la stessa cosa detta due volte.'},
  {id:'media', nome:'Equilibrata', min:3.5, max:6.5,
   testo:'Il punto in cui la quota comincia a valere qualcosa senza che la probabilità crolli.'},
  {id:'alta', nome:'Alta', min:12, max:26,
   testo:'Quota interessante, ma qui siamo già sotto una probabilità su dieci.'},
  {id:'sogno', nome:'Molto alta', min:50, max:130,
   testo:'La schedina che si racconta agli amici. Guarda la probabilità prima di raccontarla.'}
];

var CHIAVE_PUNTATA = 'seriea_puntata_v1';
function puntata(){
  if(S.puntata != null) return S.puntata;
  try{ S.puntata = parseFloat(localStorage.getItem(CHIAVE_PUNTATA)) || 20; }
  catch(e){ S.puntata = 20; }
  if(!(S.puntata > 0)) S.puntata = 20;
  return S.puntata;
}
function impostaPuntata(v){
  var n = parseFloat(String(v||'').replace(',','.'));
  S.puntata = isFinite(n) && n > 0 ? n : 0;
  try{ localStorage.setItem(CHIAVE_PUNTATA, String(S.puntata)); }catch(e){}
  var el = document.getElementById('schedElenco');
  if(el) el.innerHTML = elencoSchedine();
}

function cercaSchedine(candidati, maxSel){
  var PASSO = 0.02, MAXB = 130;                 // fino a quota 400 circa
  var dp = new Array(MAXB + 1);
  dp[0] = {v: 0, scelte: []};
  var perPartita = {};
  candidati.forEach(function(c){ (perPartita[c.iPartita] = perPartita[c.iPartita] || []).push(c); });
  Object.keys(perPartita).forEach(function(chiave){
    var nuovo = dp.slice();
    perPartita[chiave].forEach(function(c){
      if(!(c.p > 0.02)) return;
      var passi = Math.round(Math.log(1/c.p)/Math.LN10 / PASSO);
      if(passi < 1) passi = 1;
      var val = Math.log(Math.max(1e-6, c.p05));
      for(var b=0; b<=MAXB; b++){
        var st = dp[b];
        if(!st || st.scelte.length >= maxSel) continue;
        var nb = b + passi;
        if(nb > MAXB) continue;
        var nv = st.v + val;
        if(!nuovo[nb] || nv > nuovo[nb].v){
          nuovo[nb] = {v: nv, scelte: st.scelte.concat([c])};
        }
      }
    });
    dp = nuovo;
  });
  return {dp: dp, PASSO: PASSO, MAXB: MAXB, candidati: candidati};
}
function schedinaPerFascia(tab, min, max, minSel){
  var da = Math.ceil(Math.log(min)/Math.LN10 / tab.PASSO);
  var a = Math.floor(Math.log(max)/Math.LN10 / tab.PASSO);
  var meglio = null;
  for(var b=da; b<=Math.min(a, tab.MAXB); b++){
    var st = tab.dp[b];
    if(!st || st.scelte.length < (minSel||2)) continue;
    if(!meglio || st.v > meglio.v) meglio = st;
  }
  return meglio ? migliora(meglio.scelte, tab.candidati, min, max) : null;
}
/* La ricerca a tabella massimizza la somma dei pavimenti delle singole
   selezioni, che non è la stessa cosa del pavimento della SCHEDINA: due
   selezioni che sbagliano insieme si trascinano a vicenda. Qui si prova a
   sostituire una selezione alla volta e si tiene solo quello che alza il
   pavimento della combinazione, restando nella fascia di quota. */
function migliora(scelte, candidati, min, max){
  if(!candidati || !candidati.length) return scelte;
  var attuale = scelte.slice();
  var punteggio = function(sel){
    var c = M.combina(sel, 0);
    return (c && c.quota >= min*0.94 && c.quota <= max*1.06) ? c.p05 : -1;
  };
  var meglio = punteggio(attuale);
  for(var giro=0; giro<2; giro++){
    for(var i=0;i<attuale.length;i++){
      var alternativi = candidati.filter(function(c){
        return c.iPartita === attuale[i].iPartita && c.id !== attuale[i].id;
      });
      for(var k=0;k<alternativi.length;k++){
        var prova = attuale.slice();
        prova[i] = alternativi[k];
        var v = punteggio(prova);
        if(v > meglio + 1e-6){ meglio = v; attuale = prova; }
      }
    }
  }
  return attuale;
}
function candidatiGiornata(){
  var partite = (S._prossime||[]).slice(0, 10);
  var fuori = [];
  partite.forEach(function(p, i){
    var sc = sceltePartita(p, 3);
    if(!sc) return;
    sc.tutte.forEach(function(m){
      fuori.push({iPartita: i, partita: p, id: m.id, nome: m.nome,
                  p: m.p, p05: m.p05, p95: m.p95, campioni: m.campioni});
    });
  });
  return fuori;
}

/* Quanto ti restituisce davvero il banco: la quota equa meno il suo ricarico,
   che su una multipla si moltiplica a ogni selezione. Non è pessimismo, è
   quello che c'è scritto sul biglietto. */
function quotaBanco(quotaEqua, nSelezioni){
  return quotaEqua / Math.pow(1.065, nSelezioni);
}

function schedaSchedina(profilo, scelte){
  if(!scelte || !scelte.length) return '';
  var c = M.combina(scelte, 3000);
  var ogni = c.p > 0 ? Math.round(1/c.p) : 0;
  var pt = puntata();
  var qBanco = quotaBanco(c.quota, scelte.length);
  return '<div class="card sched">'+
    '<div class="schedt"><h3>'+esc(profilo.nome)+'</h3>'+
      '<div class="schedq">'+nu(c.quota,2)+'<span>quota equa</span></div></div>'+
    '<div class="vincita">'+
      '<div><div class="l">Punti</div><div class="v">'+nu(pt,0)+'</div></div>'+
      '<div class="fr">→</div>'+
      '<div><div class="l">Prendi</div><div class="v big">'+nu(pt*c.quota,0)+'</div>'+
        '<div class="s">chf alla quota equa</div></div>'+
      '<div><div class="l">Realistico</div><div class="v">'+nu(pt*qBanco,0)+'</div>'+
        '<div class="s">col ricarico del banco</div></div>'+
    '</div>'+
    '<div class="kpi" style="margin:10px 0">'+
      '<div><div class="l">Probabilità</div><div class="v">'+pc(c.p,1)+'</div>'+
        '<div class="s">fascia '+pc(c.p05,1)+'–'+pc(c.p95,1)+'</div></div>'+
      '<div><div class="l">Riesce</div><div class="v">1 su '+ogni+'</div>'+
        '<div class="s">volte che la giochi</div></div>'+
      '<div><div class="l">Selezioni</div><div class="v">'+scelte.length+'</div>'+
        '<div class="s">più ne metti, meno esce</div></div>'+
    '</div>'+
    scelte.map(function(s){
      return '<div class="row"><span class="dot" style="background:var(--c1)"></span>'+
        '<div class="n">'+esc(s.nome)+'<em>'+esc(s.partita.c)+' – '+esc(s.partita.v)+
        ' · '+esc(dataBreve(s.partita.d))+'</em></div>'+
        '<div class="v">'+pc(s.p)+'<span>min '+pc(s.p05)+'</span></div></div>';
    }).join('')+
    '<div class="note">'+esc(profilo.testo)+'</div>'+
  '</div>';
}

function elencoSchedine(){
  var partite = (S._prossime||[]).slice(0,10);
  var cand = candidatiGiornata();
  if(!cand.length){
    return '<div class="card"><div class="empty"><b>Nessun mercato attivo</b>'+
      'Accendine qualcuno in Dati → Mercati.</div></div>';
  }
  var migliori = {};
  cand.forEach(function(c){
    if(!migliori[c.iPartita] || c.p05 > migliori[c.iPartita].p05) migliori[c.iPartita] = c;
  });
  var tutte = Object.keys(migliori).map(function(k){ return migliori[k]; });
  var cTutte = M.combina(tutte, 2000);
  var pt = puntata();

  var h = '<div class="hero"><div class="l">Tutte e '+tutte.length+' le più solide insieme</div>'+
    '<div class="v">'+nu(pt*cTutte.quota, 0)+' chf</div>'+
    '<div class="s">Con '+nu(pt,0)+' chf, se escono tutte e '+tutte.length+'. '+
    'La probabilità che succeda è <b>'+pc(cTutte.p,1)+'</b>: una volta ogni '+
    Math.round(1/cTutte.p)+' schedine. È esattamente il conto che hai già fatto una volta, '+
    'e quella volta è uscita.</div></div>';
  var maxSel = Math.min(6, Math.max(2, partite.length));
  var tab = cercaSchedine(cand, maxSel);
  var trovate = 0;
  PROFILI.forEach(function(pr){
    var scelte = schedinaPerFascia(tab, pr.min, pr.max, 2);
    if(scelte){ h += schedaSchedina(pr, scelte); trovate++; }
  });
  if(!trovate) h += '<div class="card"><div class="empty">Con i mercati attivi non riesco a comporre '+
    'nessuna schedina in queste fasce di quota. Accendine qualcun altro in Dati → Mercati.</div></div>';
  return h;
}

function tabSchedine(){
  if(!(S._prossime||[]).length) S._prossime = prossimePartite();
  var partite = (S._prossime||[]).slice(0,10);
  if(!partite.length){
    return '<div class="card"><div class="empty"><b>Nessuna partita in calendario</b>'+
      'Le schedine si costruiscono sulle partite in arrivo.</div></div>';
  }
  var h = '<div class="h2">Quanto ci punti</div>'+
    '<div class="card"><div class="riga-punta">'+
      '<input id="puntataIn" type="number" inputmode="decimal" step="1" min="1" '+
        'value="'+nu(puntata(),0)+'" oninput="impostaPuntata(this.value)">'+
      '<span>chf. È l\'unica cosa che ti chiedo di scrivere in tutta l\'app: '+
      'da qui in giù i conti sono fatti su questa cifra.</span>'+
    '</div></div>';
  h += '<div class="note" style="margin-bottom:14px">Le selezioni sono le stesse che vedi nella '+
    '<b>Giornata</b>, prese dalla stessa funzione: se lì una partita dice una cosa, qui non può dirne '+
    'un\'altra. A parità di quota scelgo la combinazione su cui il modello è più sicuro — quella col '+
    'pavimento più alto, non con la media più alta.</div>';
  h += '<div id="schedElenco">'+elencoSchedine()+'</div>';
  h += '<div class="note warn"><p>La colonna <b>"prendi"</b> usa la quota equa: quella che renderebbe '+
    'la giocata un pareggio nel lungo periodo. Nessun operatore te la offre. La colonna '+
    '<b>"realistico"</b> toglie un ricarico del 6.5% per selezione, che è l\'ordine di grandezza vero.</p>'+
    '<p>Le multiple sono la parte del mercato dove quel margine pesa di più, perché si moltiplica a '+
    'ogni selezione. Con sei selezioni il banco parte con quasi il 50% di vantaggio. Il modello qui '+
    'serve a sapere quanto vale davvero quello che stai per giocare, non a promettere che esce.</p></div>';
  return h;
}

/* ══════════════════════════════════════════════════════════════
   VISTA: SQUADRE
   ══════════════════════════════════════════════════════════════ */
function formaSquadra(nome, n){
  n = n || 5;
  var out = [], i, p;
  for(i=S.doc.partite.length-1; i>=0 && out.length<n; i--){
    p = S.doc.partite[i];
    if(p.gc == null) continue;
    if(p.c === nome) out.push({e: p.gc>p.gv?'V':(p.gc===p.gv?'N':'P'), t:p.v, r:p.gc+'-'+p.gv, casa:true, d:p.d});
    else if(p.v === nome) out.push({e: p.gv>p.gc?'V':(p.gc===p.gv?'N':'P'), t:p.c, r:p.gc+'-'+p.gv, casa:false, d:p.d});
  }
  return out;
}
function pallini(forma){
  var col = {V:'var(--ok)', N:'var(--c9)', P:'var(--warn)'};
  return '<span style="display:inline-flex;gap:3px">'+forma.map(function(f){

/* ══════════════════════════════════════════════════════════════
   VISTA: PRECISIONE

   La versione precedente si apriva con "RPS 0.1900" e una curva di
   calibrazione. Sono i numeri giusti, ed è il modo sbagliato di dirli: chi
   guarda vuole sapere una cosa sola, cioè se può fidarsi, e quella cosa si può
   scrivere in italiano.

   Quindi in cima c'è la frase, e i numeri stanno sotto per chi li vuole.
   ══════════════════════════════════════════════════════════════ */

/* La fascia con più casi diventa la frase: "quando dico ~65%, succede il 67%". */
function fraseCalibrazione(bins){
  if(!bins) return null;
  /* Fra le fasce con abbastanza casi si prende la più ALTA, non la più
     popolosa: la fascia con più casi è quella intorno al 25%, e "quando dico
     25% succede il 25%" è vero ma non è la domanda che si fa uno che gioca. */
  var utili = bins.filter(function(b){ return b.n >= 40 && b.previsto != null && b.da >= 0.5; });
  if(!utili.length) utili = bins.filter(function(b){ return b.n >= 40 && b.previsto != null; });
  if(!utili.length) return null;
  utili.sort(function(a,b){ return b.previsto - a.previsto; });
  var b = utili[0];
  return {previsto: b.previsto, osservato: b.osservato, n: b.n,
          scarto: b.osservato - b.previsto};
}
function erroreMedioCalibrazione(bins){
  if(!bins) return null;
  var peso = 0, somma = 0;
  bins.forEach(function(b){
    if(!b.n || b.previsto == null) return;
    somma += b.n * Math.abs(b.osservato - b.previsto); peso += b.n;
  });
  return peso ? somma / peso : null;
}

  var b = S.back;

  var fr = fraseCalibrazione(b.modello.calibrazione);
  var errCal = erroreMedioCalibrazione(b.modello.calibrazione);
  var c = b.confronto;

  /* ── la risposta, in una frase ── */

    h += '<div class="h2">Contro chi mi misuro</div><div class="card">'+
      '<div class="gara"><div class="garar"><span class="gn">Chi tira a indovinare</span>'+
        '<span class="gv neg">−'+nu(vsCaso,0)+'%</span></div>'+
      '<div class="garar"><span class="gn">Le quote di chiusura</span>'+
        '<span class="gv '+(vsMerc>=-1?'pari':'neg')+'">'+
        (Math.abs(vsMerc)<1 ? 'alla pari' : (vsMerc>0?'+':'−')+nu(Math.abs(vsMerc),1)+'%')+'</span></div>'+
      '</div>'+
      '<div class="note"><p>Contro chi indovina con le frequenze storiche sono <b>'+nu(vsCaso,0)+
      '% più preciso</b>. Contro le quote di chiusura sono <b>'+
      (Math.abs(vsMerc)<1?'alla pari':nu(Math.abs(vsMerc),1)+'% '+(vsMerc>0?'avanti':'dietro'))+'</b>.</p>'+
      '<p>Il secondo numero è quello che conta, ed è alla pari per un motivo preciso: quando le quote '+
      'ci sono, <b>le uso</b>. Da solo starei '+nu(Math.abs(soloModello),1)+'% dietro — le quote di '+
      'chiusura contengono formazioni e infortuni dell\'ultimo minuto, che a un modello statistico '+
      'mancano. Batterle stabilmente non riesce quasi a nessuno, e chi dice di farlo di solito ha '+
      'sbagliato i conti.</p></div></div>';
  }

  /* ── i pronostici che l'app ha segnato da sola ── */
  var bp = bilancioPronostici();
  h += '<div class="h2">I pronostici che ho segnato<span class="r">'+

  if(!bp){

      'Fra qualche settimana qui ci sarà scritto come me la cavo <b>sulle previsioni che ho fatto '+

    h += '<div class="kpi">'+

      '<div><div class="l">Scarto</div><div class="v '+(Math.abs(d)<0.08?'':(d>0?'pos':'neg'))+'">'+
        (d>=0?'+':'−')+pc(Math.abs(d))+'</div><div class="s">'+

    h += '<div class="h3" style="margin-top:14px">Gli ultimi</div>'+

  }
  h += '</div>';

  /* ── la calibrazione, spiegata ── */
  h += '<div class="h2">Dico la verità sulle percentuali?</div><div class="card">'+
    curvaCalibrazione(b.modello.calibrazione)+
    '<div class="note">Un modello può azzeccare tanti risultati ed essere bugiardo lo stesso, se dice '+
    '80% quando la verità è 60%. Qui si vede: ogni punto è una fascia di probabilità, l\'altezza è '+
    'quello che è successo davvero. <b>Più i punti stanno sulla linea, più le percentuali sono oneste.</b></div>'+
    '</div>';

  h += '<div class="h2">Fascia per fascia</div><div class="card">'+

      var dd = x.osservato - x.previsto;

        '<em>'+x.n+' casi</em></div>'+
        '<div class="v">'+pc(x.osservato,1)+'<span class="'+(Math.abs(dd)<0.05?'':(dd>0?'su':'giu'))+'">'+
        (dd>=0?'+':'−')+nu(Math.abs(dd)*100,1)+' pt</span></div></div>';
    }).join('')+'</div>';

  /* ── i tre numeri che il backtest sceglie da sé ── */
  h += '<div class="h2">Quello che ho imparato da solo</div><div class="card">'+
    '<div class="row"><div class="n">Quanto pesano i gol attesi<em>invece dei gol veri</em></div>'+

    'quando cambiano i dati.</div></div>';

  h += '<div class="h2">Cosa non so</div><div class="card"><div class="note warn">'+

}

var ORE_ROBOT = [5, 11, 17, 23];      /* UTC, ai minuti :17 — vedi il workflow */
function prossimoGiro(){
  var ora = new Date();
  var d = new Date(Date.UTC(ora.getUTCFullYear(), ora.getUTCMonth(), ora.getUTCDate(),
                            ora.getUTCHours(), 17, 0));
  while(d <= ora || ORE_ROBOT.indexOf(d.getUTCHours()) < 0) d = new Date(d.getTime() + 3600000);
  var min = Math.round((d - ora)/60000);
  return {quando: d, completo: d.getUTCHours() === 5,
          fra: min < 60 ? min + ' minuti' : Math.round(min/60) + ' ore',
          ora: String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
}
