function formaSquadra(nome, n){
  n = n || 5;
  var out = [], i, p;
  for(i=S.doc.partite.length-1; i>=0 && out.length<n; i--){
    p = S.doc.partite[i];
    if(p.gc == null) continue;
    if(p.c === nome) out.push({e: p.gc>p.gv?'V':(p.gc===p.gv?'N':'P'), t:p.v, r:p.gc+'-'+p.gv, casa:true, d:p.d});
    else if(p.v === nome) out.push({e: p.gv>p.gc?'V':(p.gc===p.gv?'N':'P'), t:p.c, r:p.gc+'-'+p.gv, casa:false, d:p.d});
  }
  return out;
}

  var h = '';
  h += '<div class="h2">Forza delle squadre<span class="r">'+lista.length+'</span></div>';

    'I numeri non sono gol ma forze relative, stimate su '+

  h += '<div class="h2">Classifica delle forze</div><div class="card">'+
    lista.map(function(f,i){
      var forma = formaSquadra(f.squadra, 5);
      return '<div class="row tap" onclick="apriSquadra(\''+esc(f.squadra).replace(/'/g,'')+'\')">'+
        '<div class="pos">'+(i+1)+'</div>'+
        '<div class="n">'+esc(f.squadra)+'<em>'+(forma.length?pallini(forma):'nessuna partita recente')+'</em></div>'+
        '<div class="v">'+(f.forza>=0?'+':'−')+nu(Math.abs(f.forza),2)+
        '<span>segna '+nu(f.golAttesiCasa,2)+' · subisce '+nu(f.golSubitiCasa,2)+'</span></div></div>';
    }).join('')+
    '<div class="note">Il numero grande è la forza complessiva: attacco più difesa, zero è la media della lega. '+

    'Sono medie, non profezie: in una partita sola la fortuna pesa più della forza.</div></div>';
  return h;
}

      return '<div class="row"><div class="n">'+esc(x.nome)+'<em>'+x.n+' gare · '+sev+

        '<div class="v">'+nu(x.gialliCorretti,2)+'<span>'+nu(x.rossiCorretti,2)+' rossi</span></div></div>';
    }).join('')+'</div>';

}

function tabAffidabilita(){
  var b = S.back;
  if(!b){
    return '<div class="card"><div class="empty"><b>Backtest non disponibile</b>'+
      'Servono almeno tre stagioni di dati per giudicare il modello senza barare.</div></div>';
  }
  var c = b.confronto;
  var h = '';
  h += '<div class="hero"><div class="l">Prova sul campo</div>'+
    '<div class="v">'+nu(b.modello.rps,4)+'</div>'+
    '<div class="s">Errore medio (RPS) su <b>'+b.partite+' partite</b> mai viste dal modello quando le ha previste, '+
    'dal '+esc(dataLunga(b.da))+' a oggi. Più basso è, meglio è.</div></div>';
  if(c){
    var usato = c.ancorato || c.modello;         /* quella che l'app mostra davvero */
    var vsBase = (1 - usato.rps/c.baseline.rps)*100;
    var vsMerc = (1 - usato.rps/c.mercato.rps)*100;
    var guadagno = c.ancorato ? (1 - c.ancorato.rps/c.modello.rps)*100 : 0;
    h += '<div class="kpi">'+
      '<div><div class="l">Meglio del caso</div><div class="v pos">+'+nu(vsBase,1)+'%</div>'+
        '<div class="s">contro chi tira a indovinare con le frequenze storiche</div></div>'+
      '<div><div class="l">Contro il mercato</div><div class="v '+(vsMerc>=-0.5?'pos':'neg')+'">'+
        (vsMerc>=0?'+':'')+nu(vsMerc,1)+'%</div><div class="s">contro le quote di chiusura</div></div>'+
      '<div><div class="l">Azzeccate</div><div class="v">'+pc(usato.accuratezza)+'</div>'+
        '<div class="s">esito più probabile</div></div>'+
    '</div>';
    h += '<div class="h2">Confronto diretto<span class="r">'+c.n+' partite</span></div><div class="card">'+
      barreOriz([
        {l:'Modello + mercato', v:usato.rps, testo:nu(usato.rps,4), colore:'var(--c1)'},
        {l:'Mercato', v:c.mercato.rps, testo:nu(c.mercato.rps,4), colore:'var(--c9)'},
        {l:'Modello da solo', v:c.modello.rps, testo:nu(c.modello.rps,4), colore:'var(--c9)'},
        {l:'Caso', v:c.baseline.rps, testo:nu(c.baseline.rps,4), colore:'var(--c9)'}
      ])+
      '<div class="note">'+
      '<p>Il modello <b>da solo</b> sta '+nu(Math.abs((1 - c.modello.rps/c.mercato.rps)*100),1)+
      '% dietro alle quote di chiusura. È il risultato normale e onesto: quelle quote contengono soldi '+
      'veri, formazioni ufficiali e infortuni dell\'ultimo minuto. Batterle stabilmente non riesce '+
      'quasi a nessuno, e un modello che dicesse di farlo starebbe quasi certamente sbagliando i conti.</p>'+
      (c.ancorato ? '<p>Per questo il modello, quando le quote ci sono, <b>le usa</b> invece di limitarsi '+
        'a esserne battuto: ancorando i gol attesi a quello che dice il mercato guadagna <b>'+
        nu(guadagno,1)+'%</b> e arriva '+(vsMerc>=0 ? 'a superarlo di un soffio' : 'a '+nu(-vsMerc,1)+
        '% dal mercato')+'. Il guadagno non riguarda solo l\'1X2: sposta i gol attesi, e da lì '+
        'tutti gli altri sessanta mercati.</p>' : '')+
      '<p>Contro chi indovina a caso il guadagno è <b>'+nu(vsBase,1)+'%</b>.</p></div></div>';
    if(b.perAncora && b.perAncora.length){
      h += '<div class="h2">Quanto dare retta al mercato</div><div class="card">'+
        barreOriz(b.perAncora.map(function(x){
          return {l: x.ancoraggio===0?'per niente':pc(x.ancoraggio),
                  v: 1/x.rps, testo:nu(x.rps,4),
                  colore: x.ancoraggio===b.ancoraMigliore ? 'var(--c1)' : 'var(--c9)'};
        }))+
        '<div class="note">Nemmeno questo l\'ho scelto io: è il peso che ha reso il backtest più preciso. '+
        'Si ferma prima del 100% di proposito — a quel punto il modello non direbbe più niente di suo, e '+
        'la sua probabilità non si potrebbe più confrontare con la quota per cercare valore.</div></div>';
    }
  }
  h += '<div class="h2">Calibrazione</div><div class="card">'+curvaCalibrazione(b.modello.calibrazione)+
    '<div class="note">Un modello può azzeccare tanti risultati ed essere comunque bugiardo, se dice 80% quando '+
    'la verità è 60%. Qui si vede: i punti vicini alla linea vogliono dire che quando dice 30%, succede circa '+
    'il 30% delle volte.'+
    (b.modello.scartoOver!=null? ' Sull\'Over 2.5 lo scarto medio è di <b>'+nu(b.modello.scartoOver*100,1)+
      ' punti percentuali</b>.':'')+'</div></div>';
  h += '<div class="h2">Fasce di probabilità</div><div class="card">'+
    b.modello.calibrazione.filter(function(x){ return x.n>=15; }).map(function(x){
      var d = x.osservato - x.previsto;
      return '<div class="row"><div class="n">'+pc(x.da)+'–'+pc(x.a)+'<em>'+x.n+' casi</em></div>'+
        '<div class="v">'+pc(x.osservato,1)+'<span>detto '+pc(x.previsto,1)+' · '+(d>=0?'+':'−')+
        nu(Math.abs(d)*100,1)+'</span></div></div>';
    }).join('')+'</div>';
  if(b.perStiro && b.perStiro.length > 1){
    h += '<div class="h2">Il difetto che si corregge da solo</div><div class="card">'+
      barreOriz(b.perStiro.map(function(x){
        return {l: x.stiro===1?'nessuna correzione':'×'+nu(x.stiro,2),
                v: 1/x.rps, testo:nu(x.rps,4),
                colore: x.stiro===b.stiroMigliore ? 'var(--c1)' : 'var(--c9)'};
      }))+
      '<div class="note">Il backtest trova sempre lo stesso difetto: il modello tiene le partite un po\' '+
      'più in bilico di come finiscono. Allargare lo squilibrio di <b>×'+nu(b.stiroMigliore,2)+'</b> — senza '+
      'toccare il totale dei gol — lo corregge. Vale solo quando non ci sono quote: quando ci sono, '+
      'a rimettere le cose a posto ci pensa l\'ancoraggio.</div></div>';
  }
  h += '<div class="h2">Quanto pesano i tiri</div><div class="card">'+
    '<p class="lede">Il modello ne tiene due: uno stimato sui gol, uno sui tiri in porta. '+
    'Il peso non l\'ho scelto io, l\'ha scelto il backtest provando tutte le combinazioni.</p>'+
    barreOriz(b.perPeso.map(function(p){
      return {l: p.peso===0?'solo gol':(p.peso===1?'solo tiri':pc(p.peso)+' tiri'),
              v: 1/p.rps, testo:nu(p.rps,4),
              colore: p.peso===b.pesoMigliore ? 'var(--c1)' : 'var(--c9)'};
    }))+
    '<div class="note">Vince <b>'+pc(b.pesoMigliore)+' di peso ai tiri</b>. Ha senso: i tiri sono molti di più dei gol, '+
    'quindi dicono prima e con meno rumore chi sta giocando bene. Una squadra che segna poco creando tanto, '+
    'prima o poi segna.</div></div>';
  h += '<div class="h2">Cosa questo numero non dice</div><div class="card"><div class="note warn">'+
    '<p>Il backtest usa i dati come sono adesso, e i dati di allora sono gli stessi: nessuna squadra è stata '+
    'sostituita a posteriori. Ma resta una prova <b>su una lega sola e su poche stagioni</b>.</p>'+
    '<p>Il modello non sa chi è infortunato, chi ha giocato in coppa tre giorni prima, chi ha l\'allenatore '+
    'esonerato da ieri. Se lo sai tu, usalo: nel dettaglio di ogni partita puoi togliere peso a una squadra.</p>'+
    '<p>E soprattutto: una probabilità del 65% vuol dire che <b>una volta su tre finisce diversamente</b>. '+
    'Non è un errore del modello, è quello che significa 65%.</p></div></div>';
  return h;
}

/* ══════════════════════════════════════════════════════════════

var ORE_ROBOT = [5, 11, 17, 23];      /* UTC, ai minuti :17 — vedi il workflow */
function prossimoGiro(){
  var ora = new Date();
  var d = new Date(Date.UTC(ora.getUTCFullYear(), ora.getUTCMonth(), ora.getUTCDate(),
                            ora.getUTCHours(), 17, 0));
  while(d <= ora || ORE_ROBOT.indexOf(d.getUTCHours()) < 0) d = new Date(d.getTime() + 3600000);
  var min = Math.round((d - ora)/60000);
  return {quando: d, completo: d.getUTCHours() === 5,
          fra: min < 60 ? min + ' minuti' : Math.round(min/60) + ' ore',
          ora: String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
}
function cardStatoDati(){
  var m = S.meta || {};
  var pg = prossimoGiro();
  return '<div class="h2">Stato dei dati</div><div class="card">'+
    '<div class="row"><div class="n">Ultimo aggiornamento<em>'+esc(m.fonte||S.doc&&S.doc.fonte||'—')+'</em></div>'+
      '<div class="v" style="font-size:12px">'+esc(daOra(m.aggiornato || (S.doc&&S.doc.aggiornato)))+'</div></div>'+
    '<div class="row"><div class="n">Partite in archivio</div><div class="v">'+(m.partite_giocate||(S.doc?S.doc.partite.length:0))+'</div></div>'+
    '<div class="row"><div class="n">Partite in calendario</div><div class="v">'+(m.partite_in_arrivo!=null?m.partite_in_arrivo:(S.doc&&S.doc.calendario?S.doc.calendario.length:0))+'</div></div>'+
    (m.con_arbitro!=null?'<div class="row"><div class="n">Con arbitro<em>servono per la sezione arbitri</em></div><div class="v">'+m.con_arbitro+'</div></div>':'')+
    (m.con_tiri!=null?'<div class="row"><div class="n">Con i tiri<em>il secondo modello</em></div><div class="v">'+m.con_tiri+'</div></div>':'')+
    (m.con_xg!=null?'<div class="row"><div class="n">Con xG veri<em>da Understat: valgono più dei tiri</em></div>'+
      '<div class="v'+(m.con_xg?'':' ')+'">'+m.con_xg+'</div></div>':'')+
    (m.in_arrivo_con_quote!=null?'<div class="row"><div class="n">In arrivo con quote<em>servono per l\'ancoraggio al mercato</em></div>'+
      '<div class="v">'+m.in_arrivo_con_quote+'</div></div>':'')+
    (m.ultima_partita?'<div class="row"><div class="n">Ultima partita in archivio</div>'+
      '<div class="v" style="font-size:12.5px">'+esc(dataLunga(m.ultima_partita))+'</div></div>':'')+
    '<button class="btn acc" style="margin-top:12px" onclick="aggiorna()"'+(S.aggiornando?' disabled':'')+'>'+
      (S.aggiornando?'Sto aggiornando…':'Aggiorna adesso')+'</button>'+
    (S.esitoAggiornamento?'<div class="note '+(S.esitoAggiornamento.nuovo?'ok':'')+'">'+
      esc(S.esitoAggiornamento.testo)+'</div>':'')+
    '<div class="note"><p>Questo tasto <b>rilegge</b> il file dei dati e rifà tutti i conti. Non scarica '+
    'niente da internet: a scaricare è il robot su GitHub. Passa <b>quattro volte al giorno</b>: '+
    'una volta rilegge tutto l\'archivio, le altre tre aggiornano solo calendario, quote e arbitri — '+
    'perché le quote si muovono durante la giornata e l\'archivio no.</p>'+
    '<p>Prossimo giro verso le <b>'+pg.ora+'</b> ('+(pg.completo?'completo':'leggero')+'), cioè fra '+pg.fra+'. '+
    'Se non vuoi aspettare: scheda <b>Actions</b> del repository → "Aggiorna dati Serie A" → Run workflow.</p>'+
    '<p>Fra una giornata e l\'altra è normale che non cambi niente: i dati nuovi arrivano quando si gioca.</p>'+
    '</div></div>';
}
function tabDati(){

  }

  var finta = M.mercatiDaMatrice(M.matriceRisultati(1.5, 1.2, -0.04, 11));

      : '')+
    '<div class="legenda"><span class="pall visto"></span>visti sulla schedina'+

      '<span class="pall raro"></span>rari, controlla</div>';
  ordineGruppi.forEach(function(g){

      'color:var(--mute);margin:14px 0 6px">'+esc(g)+'</div><div class="chips">'+
      perGruppo[g].map(function(m){
        return '<button class="'+(mercatoAttivo(m.id)?'on':'')+' sc-'+scaffale(m.id)+
          '" onclick="commutaMercato(\''+m.id+'\')">'+
          (mercatoAttivo(m.id)?'✓ ':'')+esc(m.nome)+'</button>';
      }).join('')+'</div>';
  });
  h += '<button class="btn ghost sm" style="margin-top:14px" onclick="ripristinaMercati()">'+
    'Rimetti solo i '+nVisti+' confermati</button>'+
    '<div class="note"><p>Se trovi su Sporttip un mercato che qui manca, dimmelo e lo aggiungo: '+
    'ognuno è solo una somma di caselle della matrice dei risultati, e viene dalla stessa matrice '+
    'di tutti gli altri — per questo non possono contraddirsi fra loro.</p>'+
    '<p>E se qui ce n\'è uno che <b>su Sporttip non esiste</b>, spegnilo e dimmelo: lo tolgo dallo '+
    'scaffale sbagliato, così non ricompare al prossimo aggiornamento.</p></div></div>';

  h += '<div class="h2">Come funziona</div><div class="card"><div class="note">'+
    '<p><b>1. Le forze.</b> Ogni squadra ha due numeri: quanto segna e quanto concede. Si stimano tutti insieme '+
    'da tutte le partite in archivio, dando più peso a quelle recenti — una gara di due anni fa conta meno di un decimo '+
    'di una di ieri.</p>'+
    '<p><b>2. I gol attesi.</b> Attacco di una, difesa dell\'altra, più il vantaggio del campo, che qui vale '+

    '<p><b>3. La correzione.</b> Il Poisson puro sbaglia sui punteggi bassi: 0-0 e 1-1 capitano più spesso di quanto dica. '+

    '<p><b>4. I tiri.</b> Un secondo modello identico, stimato sui tiri in porta invece che sui gol, pesa per il '+
    (S.mod?pc(S.mod.pesoTiri):'—')+'. Un tiro in porta vale circa '+
    (S.mod&&S.mod.calibrazioneTiri?nu(S.mod.calibrazioneTiri.inPorta,3):'—')+' gol: non l\'ho deciso io, esce dai dati.</p>'+
    '<p><b>5. La matrice.</b> Da lì si costruisce la probabilità di ogni risultato fino al 10-10, e sommando le caselle '+
    'giuste vengono fuori 1X2, Over/Under e Gol/NoGol.</p>'+
    '</div></div>';
  h += '<div class="h2">Cosa NON c\'è dentro</div><div class="card"><div class="note warn">'+
    '<p>Non esiste una fonte gratuita e stabile con "tutte le statistiche del pianeta". Questo modello usa quello '+
    'che si può avere davvero e senza chiedere permesso a nessuno: risultati, tiri, tiri in porta, falli, corner, '+
    'cartellini, arbitro e quote di chiusura, per ogni partita di '+(S.doc.stagioni||[]).length+' stagioni.</p>'+
    '<p>Non ci sono: infortuni, formazioni, minuti giocati dei singoli, mercato, allenatori, meteo, motivazione. '+
    'Alcune di queste cose contano, ma nessuna è disponibile in modo affidabile e gratuito per tutte le partite. '+
    'Metterci dentro dati sbagliati o pieni di buchi peggiorerebbe le previsioni invece di migliorarle.</p>'+
    (S.doc.giocatori ? '<p>I marcatori della stagione ci sono ('+S.doc.giocatori.lista.length+
      ' giocatori) e li trovi nel dettaglio delle partite per stimare il peso di un\'assenza.</p>'
      : '<p>Il modulo giocatori è spento: si accende mettendo una chiave gratuita di football-data.org '+
        'nei segreti del repository, come spiegato nel README.</p>')+
    '</div></div>';
  h += '<div class="h2">Prestazioni</div><div class="card">'+
    '<div class="row"><div class="n">Versione dell\'app<em>se non corrisponde all\'ultima, il browser ti sta '+
      'mostrando una copia vecchia</em></div><div class="v">'+VERSIONE+'</div></div>'+
    '<div class="row"><div class="n">Partite usate per stimare</div><div class="v">'+(S.risultato.partiteUsate||0)+'</div></div>'+
    '<div class="row"><div class="n">Ristime per l\'incertezza<em>bootstrap parametrico</em></div>'+
      '<div class="v">'+((S.mod.repliche&&S.mod.repliche.length)||0)+'</div></div>'+
    (S.tempoCalcolo?'<div class="row"><div class="n">Tempo di calcolo<em>stima + backtest completo</em></div>'+
      '<div class="v">'+nu(S.tempoCalcolo/1000,1)+'s</div></div>':'')+
    '<div class="row"><div class="n">Risultati in memoria<em>per non rifare i conti a ogni apertura</em></div>'+
      '<div class="v" style="font-size:12px">'+(S.daCache?'sì':'appena calcolati')+'</div></div>'+
    '<button class="btn ghost sm" style="margin-top:12px" onclick="ricalcola()">Rifai i conti da zero</button></div>';
  return h;
}

/* ══════════════════════════════════════════════════════════════
   SCHEDE
   ══════════════════════════════════════════════════════════════ */
function modale(inner){
  document.getElementById('modal').innerHTML =
    '<div class="scrim" onclick="chiudiScrim(event)"><div class="sheet" onclick="event.stopPropagation()">'+
    '<div class="grab"></div>'+inner+'</div></div>';
  document.body.style.overflow = 'hidden';
}
function chiudiScrim(e){ if(e && e.target && e.target.classList.contains('scrim')) chiudi(); }
function chiudi(){ document.getElementById('modal').innerHTML=''; document.body.style.overflow=''; S._partitaAperta=null; }
function testa(t, sotto){
  return '<div class="sh"><div style="flex:1;min-width:0"><h3>'+t+'</h3>'+
    (sotto?'<div style="font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:.5px;'+
    'text-transform:uppercase;margin-top:3px">'+esc(sotto)+'</div>':'')+'</div>'+
    '<button onclick="chiudi()" aria-label="Chiudi">×</button></div>';
}

function apriPartita(i){
  var p = S._prossime[i];
  if(!p) return;
  S._partitaAperta = i;
  renderPartita();
}
function renderPartita(){
  var p = S._prossime[S._partitaAperta];
  var pr = previsione(p);
  var k = chiavePartita(p);
  var agg = S.aggiustamenti[k] || {casa:0, via:0};
  var arbSel = S.arbitroScelto[k] || '';
  var h = testa(esc(p.c)+' — '+esc(p.v), dataLunga(p.d) + (p.o? ' · '+p.o : ''));
  h += barraProb(pr);
  h += '<div class="kpi" style="margin-top:12px">'+
    '<div><div class="l">Gol attesi</div><div class="v">'+nu(pr.golCasa,2)+'–'+nu(pr.golVia,2)+'</div>'+
      '<div class="s">totale '+nu(pr.totale,2)+'</div></div>'+
    '<div><div class="l">Over 2.5</div><div class="v">'+pc(pr.over25)+'</div>'+
      '<div class="s">under '+pc(pr.under25)+'</div></div>'+
    '<div><div class="l">Gol/Gol</div><div class="v">'+pc(pr.gol)+'</div>'+
      '<div class="s">nogol '+pc(pr.nogol)+'</div></div>'+
  '</div>';

  var anc = pr.ancoraggio || {};
  if(anc.usato){
    h += '<div class="h2">Da dove viene questo numero</div><div class="card">'+
      '<div class="row"><div class="n">Modello da solo<em>forze, xG, vantaggio del campo</em></div>'+
        '<div class="v" style="font-size:12.5px">'+pc(pr.puro.casa)+' · '+pc(pr.puro.pari)+' · '+pc(pr.puro.via)+
        '<span>over '+pc(pr.puro.over25)+'</span></div></div>'+
      (anc.mercato1x2 ? '<div class="row"><div class="n">Quote di chiusura<em>quello che dice il banco</em></div>'+
        '<div class="v" style="font-size:12.5px">'+pc(anc.mercato1x2[0])+' · '+pc(anc.mercato1x2[1])+' · '+
        pc(anc.mercato1x2[2])+(anc.mercatoOver!=null?'<span>over '+pc(anc.mercatoOver)+'</span>':'')+
        '</div></div>' : '')+
      '<div class="row"><div class="n"><b>Stima usata</b><em>le due lette insieme, peso al mercato '+
        pc(anc.pesoUsato)+'</em></div>'+
        '<div class="v" style="font-size:12.5px;color:var(--accent)">'+pc(pr.casa)+' · '+pc(pr.pari)+' · '+
        pc(pr.via)+'<span>over '+pc(pr.over25)+'</span></div></div>'+
      '<div class="note">Il peso non è una scelta di gusto: è il numero che ha reso il backtest più '+
      'preciso, ed è alto perché le quote di chiusura contengono formazioni e infortuni che a un modello '+
      'statistico mancano. L\'ancoraggio non tocca solo l\'1X2: sposta i <b>gol attesi</b>, e da lì '+
      'ricadono tutti gli altri mercati, anche quelli che il banco non quota.</div></div>';
  } else if(!p.q){
    h += '<div class="note warn" style="margin-top:12px">Per questa partita non ci sono ancora quote nei '+
      'dati, quindi vedi il modello da solo. Quando arriveranno, la stima verrà ancorata al mercato e '+
      'diventerà più precisa.</div>';
  }

  var mk = mercatiDi(p, 4000);
  var cons = mk ? consiglio(mk.voci) : null;
  var sim = mk ? mk.sim : null;

  if(cons){
    var sol = cons.conQuota || cons.solida;
    h += '<div class="h2">La scelta più solida</div><div class="card">'+
      '<div class="hero" style="margin-bottom:12px"><div class="l">'+
        (cons.conQuota ? 'più solida fra quelle che pagano qualcosa' : 'la più solida in assoluto')+'</div>'+
      '<div class="v" style="font-size:26px">'+esc(sol.nome)+'</div>'+
      '<div class="s">Probabilità <b>'+pc(sol.p)+'</b>, e anche nello scenario sfavorevole resta sopra il '+
      '<b>'+pc(sol.p05)+'</b>. Quota equa '+nu(sol.quota,2)+
      ' — sotto quella cifra il banco ci guadagna comunque.</div></div>'+
      (cons.conQuota && cons.solida.id !== cons.conQuota.id
        ? '<div class="row"><div class="n">Ancora più sicura<em>ma paga quasi niente</em></div>'+
          '<div class="v" style="font-size:12.5px">'+esc(cons.solida.nome)+'<span>'+pc(cons.solida.p)+
          ' · quota '+nu(cons.solida.quota,2)+'</span></div></div>' : '')+
      '<div class="qbox"><label>Quota che ti danno su questa</label>'+
        '<input type="number" inputmode="decimal" step="0.01" id="qProva" placeholder="es. 1.60" '+
        'value="'+esc(S.quotaProva[chiavePartita(p)]||'')+'" oninput="verificaQuota(this.value)">'+
        '<div id="qEsito" class="qesito">'+testoQuota(sol, S.quotaProva[chiavePartita(p)])+'</div></div>'+
      '<div class="note">"Più solida" non vuol dire sicura: vuol dire che regge anche se ho sbagliato '+
      'la lettura delle forze e se in campo succede l\'imprevisto. La classifica è fatta sul '+
      '<b>pavimento</b> della fascia, non sul numero centrale.</div>'+
      '<div class="note warn"><p><b>E soprattutto non vuol dire conveniente.</b> Questa classifica '+
      'ordina per probabilità, non per valore: sono due cose diverse e vengono confuse sempre.</p>'+
      '<p>Al prezzo che ti fa il banco, una giocata solida rende in media <b>meno di quanto costa</b> — '+
      'il margine, il 5-7%, se lo tiene lui, e su una giocata molto probabile è quasi tutto quello che '+
      'c\'è da guadagnare. Giocare le più solide è un modo ragionevole di divertirsi e di vincere '+
      'spesso; non è un modo di guadagnare nel lungo periodo.</p>'+
      '<p>Per cercare la convenienza serve l\'altra cosa: nella sezione <b>Valore</b> scrivi la quota '+
      'vera che ti danno e il conto lo fa l\'app. Ed è lì che va segnata la giocata, per sapere fra '+
      'trecento scommesse se avevi ragione.</p></div></div>';
  }

  if(sim){
    var largh = (sim.fasce.casa.p95 - sim.fasce.casa.p05);
    var storica = S.back && S.back.modello ? M.calibra(pr.casa, S.back.modello.calibrazione) : null;
    h += '<div class="h2">Quanto fidarsi</div><div class="card">'+
      '<div class="kpi">'+
      '<div><div class="l">Simulazioni</div><div class="v">'+(sim.N/1000).toFixed(1)+'k</div>'+
        '<div class="s">partite rigiocate</div></div>'+
      '<div><div class="l">Fascia</div><div class="v">±'+pc(largh/2,0)+'</div>'+
        '<div class="s">sull\'esito 1</div></div>'+
      '<div><div class="l">Uno in dieci</div><div class="v">'+
        pc(sim.quotaRossi.casa + sim.quotaRossi.via)+'</div>'+
        '<div class="s">almeno un rosso</div></div>'+
      '</div>'+
      '<div class="note"><p>Ogni giro pesca una versione plausibile delle forze delle due squadre, '+
      'tira a sorte se qualcuno resta in dieci — con l\'effetto misurato sull\'archivio, non inventato — '+
      'e poi lascia decidere al caso i gol. Da '+sim.N+' partite rigiocate esce una fascia, non un numero.</p>'+
      (storica!=null && Math.abs(storica-pr.casa)>0.015
        ? '<p>Storicamente, quando il modello ha detto <b>'+pc(pr.casa)+'</b> in questa fascia, è finita così '+
          'il <b>'+pc(storica)+'</b> delle volte. Il numero corretto con la storia è quello.</p>'
        : '<p>Nella fascia di probabilità di questa partita, storicamente il modello ci ha preso '+
          'quanto prometteva.</p>')+
      '<p><b>E il Monza che batte il Real?</b> È dentro il conto: se qui il meno probabile dei tre esiti '+
      'sta al '+pc(Math.min(pr.casa, pr.pari, pr.via))+', vuol dire che una partita su '+
      Math.round(1/Math.max(0.01, Math.min(pr.casa, pr.pari, pr.via)))+' finisce proprio così.</p></div></div>';
  }

  if(mk){
    var giocabili = mk.voci.filter(function(m){ return mercatoAttivo(m.id); });
    var gruppi = {};
    giocabili.forEach(function(m){ (gruppi[m.gruppo] = gruppi[m.gruppo] || []).push(m); });
    h += '<div class="h2">Mercati<span class="r">'+giocabili.length+' di '+mk.voci.length+'</span></div>';
    Object.keys(gruppi).forEach(function(g){
      h += '<div class="card"><div style="font-family:var(--mono);font-size:9.5px;letter-spacing:.8px;'+
        'text-transform:uppercase;color:var(--mute);margin-bottom:4px">'+esc(g)+'</div>'+
        gruppi[g].sort(function(a,b){ return b.p - a.p; }).map(rigaMercato).join('')+'</div>';
    });
    h += '<div class="note">Vedi solo i mercati che hai segnato come disponibili. '+
      'Per cambiarli: <b>Dati → Mercati</b>.</div>'+
      '<div class="note">La barra chiara è la fascia, il trattino è la stima centrale. '+
      '<b>Quota equa</b> = quella che renderebbe la giocata un pareggio nel lungo periodo; '+
      '<b>prudente</b> = quella che servirebbe partendo dal pavimento della fascia. '+
      'Sotto la quota equa, nel lungo periodo si perde: è così che il banco campa.</div>';
  }

  h += '<div class="h2">Risultati esatti più probabili</div><div class="card">'+
    pr.risultati.map(function(r,idx){
      return '<div class="row"><div class="pos">'+(idx+1)+'</div><div class="n">'+esc(r.r)+
        (idx===0?' <span class="tag">più probabile</span>':'')+'</div><div class="v">'+pc(r.p,1)+'</div></div>';
    }).join('')+
    '<div class="note">Il risultato esatto più probabile è quasi sempre 1-0 o 1-1: succede perché nel calcio '+
    'si segna poco, e con pochi gol le combinazioni possibili sono poche. Che sia il più probabile non vuol '+
    'dire che sia probabile: qui vale <b>'+pc(pr.risultati[0].p)+'</b>, cioè capita circa una volta su '+
    Math.round(1/pr.risultati[0].p)+'.</div></div>';

  h += '<div class="h2">Tutti i punteggi</div><div class="card">'+matriceHTML(pr.matrice)+
    '<div class="note">Righe: gol di '+esc(p.c)+'. Colonne: gol di '+esc(p.v)+
    '. I numeri sono probabilità in percentuale.</div></div>';

  if(pr.primoFinale){
    var g = pr.primoFinale, eti = ['1','X','2'];
    h += '<div class="h2">Primo tempo / finale</div><div class="card">'+
      '<div class="kpi" style="margin-bottom:10px">'+
      '<div><div class="l">Gol nel 1º tempo</div><div class="v">'+pc(pr.tempi.ptO05)+'</div>'+
        '<div class="s">nel 2º: '+pc(pr.tempi.stO05)+'</div></div>'+
      '<div><div class="l">In entrambi</div><div class="v">'+pc(pr.tempi.golEntrambi)+'</div>'+
        '<div class="s">un gol per tempo</div></div>'+
      '<div><div class="l">Avanti a metà</div><div class="v">'+pc(pr.tempi.pt1)+'</div>'+
        '<div class="s">pari '+pc(pr.tempi.ptX)+'</div></div>'+
      '</div><div class="mtx"><table><tr><th></th>'+
      eti.map(function(e){ return '<th>'+e+' finale</th>'; }).join('')+'</tr>'+
      eti.map(function(e,i){
        return '<tr><th>'+e+' a metà</th>'+eti.map(function(_,j){
          var v = g[i][j];
          return '<td'+(i===j&&v>0.12?' class="hot"':'')+'>'+(v*100).toFixed(1)+'</td>';
        }).join('')+'</tr>';
      }).join('')+'</table></div>'+
      '<div class="note">Il punteggio all\'intervallo è nell\'archivio di ogni partita da sempre. '+
      'Il modello del primo tempo non decide quanti gol si fanno — quello resta il modello finale, '+
      'ancorato al mercato — decide soltanto <b>come si dividono fra i due tempi</b>: '+
      pc(pr.quotePrimoTempo[0],0)+' e '+pc(pr.quotePrimoTempo[1],0)+' delle reti attese qui. '+
      'Così le due letture non possono contraddirsi.</div></div>';
  }

  /* arbitro */
  if(S.arb && S.arb.arbitri.length){
    var car = M.cartelliniAttesi(S.arb, arbSel || null, p.c, p.v);
    h += '<div class="h2">Cartellini</div><div class="card">'+
      '<div class="field" style="margin-bottom:12px"><select onchange="scegliArbitro(\''+esc(k)+'\', this.value)">'+
      '<option value="">Arbitro non designato (media della lega)</option>'+
      S.arb.arbitri.filter(function(a){ return a.n>=5; }).map(function(a){
        return '<option value="'+esc(a.nome)+'"'+(a.nome===arbSel?' selected':'')+'>'+esc(a.nome)+
          ' — '+nu(a.gialliCorretti,2)+' gialli/gara ('+a.n+')</option>';
      }).join('')+'</select></div>'+
      '<div class="kpi">'+
      '<div><div class="l">Gialli attesi</div><div class="v">'+nu(car.gialliTotali,1)+'</div>'+
        '<div class="s">'+nu(car.gialliCasa,1)+' + '+nu(car.gialliVia,1)+'</div></div>'+
      '<div><div class="l">Oltre 3.5</div><div class="v">'+pc(car.oltre35)+'</div>'+
        '<div class="s">oltre 4.5: '+pc(car.oltre45)+'</div></div>'+
      '<div><div class="l">Rossi attesi</div><div class="v">'+nu(car.rossi,2)+'</div>'+
        '<div class="s">'+(car.noto? car.partiteArbitro+' gare' : 'media lega')+'</div></div>'+
      '</div>'+
      '<div class="note">'+(arbSel
        ? 'Con '+esc(arbSel)+' i cartellini attesi cambiano del '+
          pc(Math.abs(car.severita-1),0)+' '+(car.severita>1?'in più':'in meno')+' rispetto alla media.'
        : 'Le designazioni escono due o tre giorni prima della partita. Scegli un arbitro qui sopra per vedere come cambia.')+
      '</div></div>';
  }

  /* corner */
  if(S.corner){
    var co = M.cornerAttesi(S.corner, p.c, p.v, S.risultato ? S.risultato.vantaggioCorner : null);
    if(co){
      h += '<div class="h2">Corner</div><div class="card">'+
        '<div class="kpi">'+
        '<div><div class="l">Attesi</div><div class="v">'+nu(co.totali,1)+'</div>'+
          '<div class="s">'+nu(co.casa,1)+' + '+nu(co.via,1)+'</div></div>'+
        '<div><div class="l">Oltre 8.5</div><div class="v">'+pc(co.oltre85)+'</div>'+
          '<div class="s">oltre 9.5: '+pc(co.oltre95)+'</div></div>'+
        '<div><div class="l">Oltre 10.5</div><div class="v">'+pc(co.oltre105)+'</div>'+
          '<div class="s">oltre 11.5: '+pc(co.oltre115)+'</div></div>'+
        '</div>'+
        '<div class="note">Chi ne batte tanti contro chi ne concede tanti, riportato sulla media della '+
        'lega ('+nu(S.corner.mediaPartita,1)+' a partita) e corretto per il vantaggio del campo, che sui '+
        'corner è più marcato che sui gol. Niente di più: i corner sono numerosi ma dicono poco, e un '+
        'modello elaborato su un segnale debole è solo un modo più convincente di sbagliare.'+
        (co.noto ? '' : ' Una delle due squadre ha poche partite in archivio: qui vale la media della lega.')+
        '</div></div>';
    }
  }

  /* assenze */
  h += '<div class="h2">Assenze e stato di forma</div><div class="card">'+
    '<p class="lede">Il modello non sa chi manca. Se lo sai tu, togli peso all\'attacco: '+
    'un titolare pesante vale intorno al 10%, mezza squadra fuori il 25-30%.</p>'+
    campoSlider('casa', p.c, agg.casa||0)+
    campoSlider('via', p.v, agg.via||0)+
    ((agg.casa||agg.via) ? '<button class="btn ghost sm" style="margin-top:10px" onclick="azzeraAgg(\''+esc(k)+'\')">Rimetti tutto a zero</button>' : '')+
  '</div>';

  /* mercato */
  if(p.q){
    var mer = M.daQuote(p.q);
    h += '<div class="h2">Confronto con le quote</div><div class="card">'+
      '<div class="row"><div class="n">Vittoria '+esc(p.c)+'</div><div class="v">'+pc(pr.casa)+
        '<span>mercato '+pc(mer[0])+'</span></div></div>'+
      '<div class="row"><div class="n">Pareggio</div><div class="v">'+pc(pr.pari)+
        '<span>mercato '+pc(mer[1])+'</span></div></div>'+
      '<div class="row"><div class="n">Vittoria '+esc(p.v)+'</div><div class="v">'+pc(pr.via)+
        '<span>mercato '+pc(mer[2])+'</span></div></div>'+
      '<div class="note">Le quote sono ripulite dal ricarico del bookmaker. '+
      'Nel backtest il mercato è più preciso di questo modello: quando i due non vanno d\'accordo, '+
      'la storia dice che ha ragione lui più spesso.</div></div>';
  }

  /* forze a confronto */
  var fc = M.forze(S.mod, [p.c, p.v]);
  var a = fc.filter(function(x){ return x.squadra===p.c; })[0];
  var b = fc.filter(function(x){ return x.squadra===p.v; })[0];
  if(a && b){
    h += '<div class="h2">Come ci arrivano</div><div class="card">'+
      '<div class="row"><div class="n">'+esc(p.c)+'<em>'+pallini(formaSquadra(p.c,5))+'</em></div>'+
        '<div class="v">'+nu(a.golAttesiCasa,2)+'<span>subisce '+nu(a.golSubitiCasa,2)+'</span></div></div>'+
      '<div class="row"><div class="n">'+esc(p.v)+'<em>'+pallini(formaSquadra(p.v,5))+'</em></div>'+
        '<div class="v">'+nu(b.golAttesiCasa,2)+'<span>subisce '+nu(b.golSubitiCasa,2)+'</span></div></div>'+
      '</div>';
  }
  h += '<button class="btn ghost" style="margin-top:14px" onclick="chiudi()">Chiudi</button>';
  modale(h);
}
function campoSlider(lato, nome, val){
  return '<div style="margin-bottom:14px"><div class="sl"><span>'+esc(nome)+'</span>'+
    '<b id="lab-'+lato+'">'+(val?('−'+val+'%'):'al completo')+'</b></div>'+
    '<input class="slider" type="range" min="0" max="40" step="5" value="'+val+'" '+
    'oninput="etichettaAgg(\''+lato+'\', this.value)" onchange="impostaAgg(\''+lato+'\', this.value)"></div>';
}
function etichettaAgg(lato, v){
  var el = document.getElementById('lab-'+lato);
  if(el) el.textContent = Number(v) ? ('−'+v+'%') : 'al completo';
}
function impostaAgg(lato, v){
  var p = S._prossime[S._partitaAperta], k = chiavePartita(p);
  var a = S.aggiustamenti[k] || {casa:0, via:0};
  a[lato] = Number(v);
  if(!a.casa && !a.via) delete S.aggiustamenti[k]; else S.aggiustamenti[k] = a;
  renderPartita();
}
function azzeraAgg(k){ delete S.aggiustamenti[k]; renderPartita(); }
function scegliArbitro(k, nome){
  if(nome) S.arbitroScelto[k] = nome; else delete S.arbitroScelto[k];
  renderPartita();
}

function apriSquadra(nome){
  var f = M.forze(S.mod, [nome])[0];
  if(!f) return;
  var forma = formaSquadra(nome, 10);
  var prossime = prossimePartite().filter(function(p){ return p.c===nome || p.v===nome; }).slice(0,5);
  var tutte = M.forze(S.mod, squadreAttive());
  var pos = tutte.map(function(x){ return x.squadra; }).indexOf(nome) + 1;
  var h = testa(esc(nome), pos+'ª forza su '+tutte.length);
  h += '<div class="kpi">'+
    '<div><div class="l">Segna in casa</div><div class="v">'+nu(f.golAttesiCasa,2)+'</div>'+
      '<div class="s">contro una media</div></div>'+
    '<div><div class="l">Subisce</div><div class="v">'+nu(f.golSubitiCasa,2)+'</div>'+
      '<div class="s">a partita</div></div>'+
    '<div><div class="l">Forza</div><div class="v">'+(f.forza>=0?'+':'')+nu(f.forza,2)+'</div>'+
      '<div class="s">attacco + difesa</div></div>'+
  '</div>';
  if(prossime.length){
    h += '<div class="h2">Prossime partite</div><div class="card">'+prossime.map(function(p){
      var pr = previsione(p);
      var mia = p.c===nome ? pr.casa : pr.via;
      return '<div class="row"><div class="n">'+(p.c===nome?'contro '+esc(p.v)+' in casa':'a '+esc(p.c))+
        '<em>'+esc(dataBreve(p.d))+'</em></div><div class="v">'+pc(mia)+'<span>di vittoria</span></div></div>';
    }).join('')+'</div>';
  }
  h += '<div class="h2">Ultime partite</div><div class="card">'+
    (forma.length? forma.map(function(x){
      var col = {V:'var(--ok)',N:'var(--mute)',P:'var(--warn)'}[x.e];
      return '<div class="row"><div class="n">'+(x.casa?'':'a ')+esc(x.t)+'<em>'+esc(dataBreve(x.d))+'</em></div>'+
        '<div class="v" style="color:'+col+'">'+esc(x.r)+'</div></div>';
    }).join('') : '<div class="empty">Nessuna partita in archivio.</div>')+'</div>';
  h += '<button class="btn ghost" style="margin-top:14px" onclick="chiudi()">Chiudi</button>';
  modale(h);
}

/* ══════════════════════════════════════════════════════════════
   AZIONI
   ══════════════════════════════════════════════════════════════ */
function aggiorna(){
  if(S.aggiornando) return;
  var prima = (S.meta && S.meta.aggiornato) || '';
  var primaN = (S.meta && S.meta.partite_giocate) || 0;
  S.aggiornando = true; S.esitoAggiornamento = null; render();
  try{ localStorage.removeItem(CHIAVE_CACHE); }catch(e){}
  carica(true).then(function(){
    var dopo = (S.meta && S.meta.aggiornato) || '';
    var dopoN = (S.meta && S.meta.partite_giocate) || 0;
    if(dopo && dopo !== prima){
      S.esitoAggiornamento = {nuovo:true, testo: 'Dati nuovi: ' + (dopoN - primaN) +
        ' partite in più, aggiornati ' + daOra(dopo) + '.'};
    } else {
      var pg = prossimoGiro();
      S.esitoAggiornamento = {nuovo:false, testo: 'Nessun dato nuovo: questi sono già gli ultimi che il robot '+
        'ha trovato (' + daOra(dopo) + '). Il prossimo giro è verso le ' + pg.ora + '.'};
    }
    S.aggiornando = false; render();
  }).catch(function(){
    S.esitoAggiornamento = {nuovo:false, testo:'Non sono riuscito a rileggere il file dei dati.'};
    S.aggiornando = false; render();
  });
}
function ricalcola(){
  try{ localStorage.removeItem(CHIAVE_CACHE); }catch(e){}
  calcola();
}
function vai(t){
  if((t === 'schedine' || t === 'valore') && !(S._prossime||[]).length) S._prossime = prossimePartite();
  S.tab = t; render(); window.scrollTo(0,0);
}

/* ══════════════════════════════════════════════════════════════
   GUSCIO
   ══════════════════════════════════════════════════════════════ */
var TABS = [
  {k:'giornata', n:'Giornata', p:'M4 6h16M4 12h16M4 18h10'},
  {k:'valore', n:'Valore', p:'M12 2v20M17 6.5c0-2-2.2-3-5-3s-5 .9-5 2.8 2.4 2.6 5 3.2 5 1.3 5 3.2-2.2 2.8-5 2.8-5-1-5-3'},
  {k:'schedine', n:'Schedine', p:'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6'},
  {k:'squadre', n:'Squadre', p:'M12 3l7 4v6c0 4-3 6.5-7 8-4-1.5-7-4-7-8V7z'},
  {k:'arbitri', n:'Arbitri', p:'M6 4h9l3 4v12H6zM9 9h6M9 13h6'},
  {k:'affid', n:'Precisione', p:'M4 18L9 12l4 3 7-9M4 20h16'},
  {k:'dati', n:'Dati', p:'M4 7c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3zM4 7v10c0 1.7 3.6 3 8 3s8-1.3 8-3V7'}
];
var TITOLI = {giornata:'Giornata', valore:'Valore', schedine:'Schedine', squadre:'Squadre',
              arbitri:'Arbitri', affid:'Affidabilità', dati:'Dati'};

function sottotitolo(){
  if(S.stato !== 'pronto') return 'MODELLO SERIE A';
  if(S.tab === 'schedine') return 'COMBINAZIONI E QUOTE EQUE';
  if(S.tab === 'valore') return vistaValore()==='registro'
    ? 'IL MODELLO ALLA PROVA DEI FATTI' : 'PROBABILITÀ CONTRO PREZZO';
  var q = S.back ? ('RPS ' + nu(S.back.modello.rps,4)) : '';
  var n = S.risultato ? S.risultato.partiteUsate : 0;
  return (n + ' PARTITE' + (q ? ' · ' + q.toUpperCase() : '')) +
    (S.meta && S.meta.aggiornato ? ' · ' + daOra(S.meta.aggiornato).toUpperCase() : '');
}

function render(){
  var app = document.getElementById('app');
  if(S.stato === 'carico' || S.stato === 'calcolo'){
    app.innerHTML = '<div class="load"><h3>'+esc(S.fase)+'…</h3>'+
      '<div class="pb"><i style="width:'+Math.round((S.avanzamento||0)*100)+'%"></i></div>'+
      '<p>'+(S.stato==='calcolo'
        ? 'Sto rifacendo tutte le previsioni delle stagioni passate per sapere quanto ci si può fidare di quelle di oggi.<br>Ci vogliono pochi secondi, e succede una volta sola: poi resta in memoria.'
        : 'Un attimo.')+'</p></div>';
    return;
  }
  if(S.stato === 'senzadati'){
    app.innerHTML = '<div class="wrap"><div class="card"><div class="empty">'+
      '<b>Il file dei dati non c\'è ancora</b>'+
      'L\'app legge <code>data/serie-a.json</code>, che viene creato dal robot su GitHub.<br><br>'+
      'Vai nella scheda <b>Actions</b> del repository, apri <b>Aggiorna dati Serie A</b> e premi '+
      '<b>Run workflow</b>. Dopo un minuto ricarica questa pagina.'+
      '</div>'+
      '<div class="note warn">Dettaglio tecnico: '+esc(S.errore||'file non raggiungibile')+'</div>'+
      '<button class="btn acc" style="margin-top:12px" onclick="aggiorna()">Riprova</button>'+
      '</div></div>';
    return;
  }
  if(S.stato === 'errore'){
    app.innerHTML = '<div class="wrap"><div class="card"><div class="empty">'+
      '<b>Il calcolo si è fermato</b>'+esc(S.errore||'')+'</div>'+
      '<button class="btn acc" style="margin-top:12px" onclick="ricalcola()">Riprova</button></div></div>';
    return;
  }
  var corpo =
    S.tab==='valore' ? tabValore() :
    S.tab==='schedine' ? tabSchedine() :
    S.tab==='squadre' ? tabSquadre() :
    S.tab==='arbitri' ? tabArbitri() :
    S.tab==='affid' ? tabAffidabilita() :
    S.tab==='dati' ? tabDati() : tabGiornata();
  var h = '<div class="top"><div class="ttl"><h1>'+TITOLI[S.tab]+'</h1>'+
    '<div class="sub">'+esc(sottotitolo())+'</div></div>'+
    '<button class="ico'+(S.aggiornando?' gira':'')+'" onclick="aggiorna()" aria-label="Aggiorna">'+
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+
    '<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></button></div>';
  h += '<div class="wrap">'+corpo+'</div>';
  h += '<div class="tabs">'+TABS.map(function(t){
    return '<button class="tab '+(S.tab===t.k?'on':'')+'" onclick="vai(\''+t.k+'\')">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="'+t.p+'"/></svg>'+
      '<span>'+t.n+'</span></button>';
  }).join('')+'</div>';
  app.innerHTML = h;
}

document.addEventListener('keydown', function(e){ if(e.key==='Escape') chiudi(); });
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
carica(false);
</script>
</body>
</html>
