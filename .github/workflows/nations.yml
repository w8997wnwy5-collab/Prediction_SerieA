name: Sonda Nations League

# Una domanda sola, a mano: quanto costerebbe aggiungere le nazionali.
# Costa qualche credito di The Odds API, quindi non gira da sola.
on:
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Chiedi alla Nations League
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 scripts/_sonda_nations.py
