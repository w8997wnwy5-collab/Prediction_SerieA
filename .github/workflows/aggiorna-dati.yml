name: Aggiorna dati Serie A

on:
  schedule:
    # Il giro completo una volta al giorno, alle 05:17 UTC (07:17 in Svizzera
    # d'estate): archivio, xG, arbitri, tutto.
    # I minuti dispari non sono un vezzo: alle :00 la coda di GitHub è intasata.
    - cron: '17 5 * * *'
    # I giri leggeri servono a una cosa sola: le quote delle partite in arrivo,
    # che si muovono durante il giorno e a cui adesso il modello si ancora.
    #
    # Le ore non sono sparse a caso: il file dei fixture copre una finestra di
    # due o tre giorni, e la Serie A ci entra TARDI — il 17 settembre non c'era
    # ancora, con le partite il 18. Quindi i giri vanno messi vicino ai fischi
    # d'inizio, non distribuiti nella giornata.
    #
    # In Serie A si gioca alle 12:30, 15:00, 18:00 e 20:45 italiane, cioe' alle
    # 10:30, 13:00, 16:00 e 18:45 UTC d'estate. Questi giri stanno un'ora o poco
    # meno prima di ciascuno, piu' quello di notte che raccoglie i risultati.
    #
    # QUATTRO, e ci stanno. Con cinque campionati ogni giro costava 5 crediti
    # — uno per campionato, sempre, anche il 23 settembre con il turno
    # successivo a diciassette giorni di distanza. Erano 450 crediti al mese
    # su 500, quasi tutti spesi per chiedere le quote di partite che non
    # c'erano.
    #
    # Adesso si chiede solo ai campionati che giocano davvero (vedi
    # FINESTRA_QUOTE_* in build_data.py), e il conto cambia per intero:
    #
    #   sempre tutte, 3 giri     15.0 crediti/giorno   450 al mese
    #   solo chi gioca, 5 giri   10.7 crediti/giorno   321 al mese
    #
    # Quindi i quattro giri del giorno tornano, e si spende comunque un terzo
    # in meno: 179 crediti al mese di margine per i giri lanciati a mano.
    - cron: '47 9,12,15,17 * * *'
    - cron: '17 23 * * *'
  workflow_dispatch:          # bottone "Run workflow" nella scheda Actions
  push:
    branches: [main]
    paths:
      - 'scripts/build_data.py'
      - '.github/workflows/aggiorna-dati.yml'

permissions:
  contents: write

concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scarica e normalizza
        id: costruisci
        continue-on-error: true      # anche se la fonte è giù, vogliamo scrivere lo stato
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Solo il giro delle 05:17 rilegge tutto l'archivio; gli altri
          # aggiornano calendario, quote e arbitri e basta.
          #
          # Qui c'era scritto '17 11,17,23 * * *', che non e' nessuno degli
          # orari qui sopra: gli orari sono stati cambiati e questa riga no.
          # Risultato, la condizione non era MAI vera e tutti e sei i giri
          # rileggevano l'archivio intero — sei volte il lavoro che serviva,
          # tutti i giorni, in silenzio. Con cinque campionati sarebbero
          # centottanta CSV al giorno contro una fonte che chiede gentilezza.
          # Adesso la condizione nomina i giri LEGGERI invece del completo:
          # cosi' anche il bottone a mano e i push fanno il giro completo,
          # che e' quello che uno si aspetta quando lo lancia apposta.
          MODO: ${{ (github.event.schedule == '47 9,12,15,17 * * *' || github.event.schedule == '17 23 * * *') && 'leggero' || 'completo' }}
        run: python scripts/build_data.py

      - name: Committa se qualcosa è cambiato
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          MODO: ${{ (github.event.schedule == '47 9,12,15,17 * * *' || github.event.schedule == '17 23 * * *') && 'leggero' || 'completo' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Quattro giri al giorno più chi lavora sul repository: prima o poi due
          # push si incrociano e quello che arriva secondo viene rifiutato. Senza
          # questo, un giro che ha scaricato tutto correttamente finisce in rosso
          # e i dati di quel ciclo si buttano.
          #
          # Prima qui c'era un `git pull --rebase`, e non poteva funzionare:
          # data/serie-a.json viene RISCRITTO INTERO a ogni giro, quindi due
          # versioni diverse sono un conflitto su tutto il file, e il rebase si
          # ferma. È così che il giro 86 è finito in rosso in cinque secondi,
          # senza nemmeno arrivare al secondo tentativo.
          #
          # E nemmeno si può imporre la propria versione: un giro leggero parte
          # dal file su disco e ci aggiunge calendario e quote, quindi se il file
          # da cui è partito era vecchio di un ciclo, imporlo cancellerebbe i
          # risultati arrivati nel frattempo.
          #
          # Quello che si fa invece è l'unica cosa corretta: si butta la propria
          # versione, si riparte dal file appena pubblicato dall'altro e si
          # RIFÀ il conto. Costa un minuto e non può perdere niente.
          for tentativo in 1 2 3; do
            git add data/
            if git diff --staged --quiet; then
              echo "Niente di nuovo: nessun commit."
              exit 0
            fi
            git commit -m "dati: aggiornamento automatico $(date -u '+%Y-%m-%d %H:%M UTC')"
            if git push; then
              echo "Dati aggiornati e pubblicati."
              exit 0
            fi
            echo "Push rifiutato (tentativo $tentativo): qualcuno ha pubblicato prima."
            if [ "$tentativo" = "3" ]; then break; fi
            sleep $((tentativo * 5))
            git fetch origin "${GITHUB_REF_NAME}" || exit 1
            git reset --hard "origin/${GITHUB_REF_NAME}" || exit 1
            echo "Riparto dal file appena pubblicato e rifaccio il conto."
            python scripts/build_data.py || exit 1
          done
          echo "Tre tentativi di push falliti: mi fermo."
          exit 1

      - name: Fallisci se i dati sono stati rifiutati
        if: steps.costruisci.outcome == 'failure'
        run: |
          echo "Lo script ha segnalato un problema: guarda il riepilogo qui sopra."
          exit 1
